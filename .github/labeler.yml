nafems:
- changed-files:
  - any-glob-to-any-file:
    - tests/nafems/**
cmake:
- changed-files:
  - any-glob-to-any-file:
    - '**/CMakeLists.txt'
    - '**/*.cmake'
    - cmake/**
    - tests/cmake/**
ci:
- changed-files:
  - any-glob-to-any-file:
