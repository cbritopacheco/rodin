# Alternative paths use OR matching. Module rules include nested MPI/PETSc test directories.
# Maintenance and regression instructions: dev/labeler.md.
docs:
- changed-files:
  - any-glob-to-any-file:
    - doc/**
    - '**/*.md'
    - '**/*.cff'
examples:
- changed-files:
  - any-glob-to-any-file:
    - examples/**
    - resources/examples/**
benchmarks:
- changed-files:
  - any-glob-to-any-file:
    - tests/benchmarks/**
unit-tests:
- changed-files:
  - any-glob-to-any-file:
    - tests/unit/**
manufactured-tests:
