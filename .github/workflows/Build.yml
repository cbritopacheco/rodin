name: Build
permissions:
  contents: read
on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches: [master, develop]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: Build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Ubuntu:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        compiler: [gcc-12]
        build_type: ['Release', 'Debug']
        multithreaded: ['ON', 'OFF']
        mpi: ['ON', 'OFF']
        petsc: ['ON', 'OFF']
      fail-fast: false
    env:
      MAKEFLAGS: "-j2"
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          lfs: false
      - uses: ./.github/actions/prepare-apt
      - name: Setup Cpp (C++ / C)
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.compiler }}
          cmake: true
      - name: Install dependencies
        uses: ./.github/actions/apt-dependencies
        with:
          packages: libboost1.74-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev libmetis-dev libhdf5-dev libomp-dev petsc-dev mpich lcov
      - name: Configure CMake
        run: >
          cmake
          -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DRODIN_BUILD_DOC=OFF
          -DRODIN_INSTALL_RESOURCES=OFF
          -DRODIN_USE_MCSS=OFF
          -DRODIN_BUILD_SRC=ON
          -DRODIN_BUILD_EXAMPLES=ON
          -DRODIN_MULTITHREADED=${{ matrix.multithreaded }}
          -DRODIN_USE_MPI=${{ matrix.mpi }}
          -DRODIN_USE_PETSC=${{ matrix.petsc }}
      - name: Build
        run: cmake --build ${{github.workspace}}/build
  MacOS:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
        build_type: ['Release', 'Debug']
        multithreaded: ['ON', 'OFF']
        mpi: ['ON', 'OFF']
        petsc: ['ON', 'OFF']
      fail-fast: false
    env:
      MAKEFLAGS: "-j2"
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          lfs: false
      - name: actions/setup-python#577
        run: |
          brew list -1 | grep python | while read formula; do brew unlink $formula; brew link --overwrite $formula; done
      - name: Install dependencies
        run: |
          brew update
          brew install \
            boost boost-mpi \
            suitesparse \
            eigen \
            scotch \
            metis \
            hdf5-mpi \
            libomp \
            petsc \
            open-mpi \
            lcov
      - name: Configure CMake
        run: >
          cmake
          -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DRODIN_BUILD_DOC=OFF
          -DRODIN_INSTALL_RESOURCES=OFF
          -DRODIN_USE_MCSS=OFF
          -DRODIN_BUILD_SRC=ON
          -DRODIN_BUILD_EXAMPLES=ON
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DRODIN_MULTITHREADED=${{ matrix.multithreaded }}
          -DRODIN_USE_MPI=${{ matrix.mpi }}
          -DRODIN_USE_PETSC=${{ matrix.petsc }}
          -DOpenMP_ROOT=/opt/homebrew/opt/libomp
      - name: Build
        run: cmake --build ${{github.workspace}}/build

  # Compile CUDA, HIP and SYCL tests and examples in the Kokkos CI images.
  # Hosted runners have no GPU; these jobs only compile.
  Kokkos:
    name: Ubuntu 24.04 / Kokkos / ${{ matrix.backend }} / ${{ matrix.target }}
    permissions:
      contents: read
      packages: read
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      matrix:
        include:
          - image: cuda-sm52
            backend: CUDA
            target: Maxwell sm_52
          - image: hip-gfx1201
            backend: HIP
            target: RDNA 4 gfx1201
          - image: sycl-bmg
            backend: SYCL
            target: Battlemage
      fail-fast: false
    env:
      IMAGE: ${{ vars.RODIN_KOKKOS_CI_IMAGES || 'ghcr.io/keckj/rodin-kokkos-ci' }}:${{ matrix.image }}
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          lfs: false
      # The CUDA image takes 19 GB once unpacked.
      - name: Check image disk headroom
        run: python3 dev/ci_environment.py disk --minimum-gib 32
      - name: Pull image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE"
      - name: Build Kokkos tests
        run: >
          docker run --rm -e JOBS=4 -v "$GITHUB_WORKSPACE:/rodin" -w /rodin "$IMAGE"
          dev/docker/kokkos/ci-test.sh --build-only /rodin /rodin/build-kokkos-ci
