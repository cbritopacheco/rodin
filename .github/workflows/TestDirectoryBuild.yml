name: Tests / Build / Hierarchy
'on':
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      common:
        type: string
        required: true
      id:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  Build:
    name: Compile Hierarchy Group
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
      OMP_WAIT_POLICY: PASSIVE
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - name: Check compilation disk headroom
        run: python3 dev/ci_environment.py disk
      - name: Hydrate discovery resources
        run: python3 dev/ci_lfs.py --include="resources/medit/Square.medit.mesh,resources/mfem/Square.mfem.mesh,resources/mfem/SquareWithHole.mfem.mesh,resources/mfem/StarSquare.mfem.mesh,resources/examples/ShapeOptimization/LevelSetCantilever2D.mfem.mesh,resources/tests/mfem/h1/**"
      - uses: ./.github/actions/download-artifacts
        with:
          names: '["ci-build-index-${{ inputs.common }}"]'
          path: .
          merge-single: true
      - name: Resolve directory configuration
        id: configuration
        env:
          BUILD_ID: ${{ inputs.id }}
        run: python3 dev/ci_build_graph.py directory-definition --id "$BUILD_ID"
      - uses: ./.github/actions/test-environment
        with:
          definition: ${{ steps.configuration.outputs.definition }}
      - name: Check disk headroom after dependency installation
        run: python3 dev/ci_environment.py disk
      - name: Download this configuration's common objects
        uses: ./.github/actions/download-artifacts
        with:
          names: '["ci-common-${{ inputs.common }}"]'
          path: ci-runtime-inputs/ci-common-${{ inputs.common }}
          merge-single: true
      - name: Compile directory executables using common objects
        env:
          BUILD_ID: ${{ inputs.id }}
          CI_RESTORED_ARTIFACTS: ${{ github.workspace }}/ci-runtime-inputs
        run: python3 dev/ci_build_graph.py directory --id "$BUILD_ID"
      - uses: ./.github/actions/upload-artifacts
        with:
          overwrite: true
          name: ci-build-${{ inputs.id }}
          path: ci-build-artifact/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: ./.github/actions/upload-artifacts
        with:
          overwrite: true
          name: ci-built-${{ inputs.id }}
          path: ci-built-record/
          if-no-files-found: error
