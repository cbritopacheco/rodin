name: Documentation
permissions:
  contents: write
on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

concurrency:
  group: Documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build-And-Deploy:
    runs-on: ubuntu-latest
    env:
      MAKEFLAGS: "-j2"
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.0
          cache: 'pip'
      - run: pip install -r doc/requirements.txt
      - name: Install dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          dvisvgm
          texlive-base
          texlive-latex-extra
          texlive-fonts-extra
          texlive-fonts-recommended
      - name: Install pinned Doxygen
        # Use the same parser as the Style warning check.
        run: |
          curl -fsSL -o doxygen.tar.gz \
            https://github.com/doxygen/doxygen/releases/download/Release_1_14_0/doxygen-1.14.0.linux.bin.tar.gz
          tar -xzf doxygen.tar.gz
          echo "$PWD/doxygen-1.14.0/bin" >> "$GITHUB_PATH"
      - name: Configure CMake
        run: >
          cmake
          -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=Release
          -DRODIN_BUILD_DOC=ON
          -DRODIN_INSTALL_RESOURCES=OFF
          -DRODIN_USE_MCSS=ON
          -DRODIN_BUILD_SRC=OFF
          -DRODIN_BUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build ${{github.workspace}}/build --target RodinDoxygen
      - name: Deploy
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{github.workspace}}/build/doc/html
          destination_dir: docs/${{ github.ref }}
