name: Documentation
permissions:
  contents: read
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: Documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build-And-Deploy:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    env:
      MAKEFLAGS: "-j2"
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
          persist-credentials: false
      - name: Mark documentation as running
        if: github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          RUN: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python3 dev/ci_badges.py --documentation-only --branch "$BRANCH"
          --documentation running --source-run "$RUN" --source-sha "$SHA"
          --source-attempt "$ATTEMPT"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.0
          cache: 'pip'
      - run: pip install -r doc/requirements.txt
      - name: Install dependencies
        uses: ./.github/actions/apt-dependencies
        with:
          packages: dvisvgm texlive-base texlive-latex-extra texlive-fonts-extra texlive-fonts-recommended
      - name: Install pinned Doxygen
        # Use the same parser as the Style warning check.
        run: |
          curl -fsSL -o doxygen.tar.gz \
            https://github.com/doxygen/doxygen/releases/download/Release_1_15_0/doxygen-1.15.0.linux.bin.tar.gz
          tar -xzf doxygen.tar.gz
          echo "$PWD/doxygen-1.15.0/bin" >> "$GITHUB_PATH"
      - name: Configure CMake
        run: >
          cmake
          -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=Release
          -DRODIN_BUILD_DOC=ON
          -DRODIN_INSTALL_RESOURCES=OFF
          -DRODIN_USE_MCSS=ON
          -DRODIN_BUILD_SRC=OFF
          -DRODIN_BUILD_EXAMPLES=OFF
      - name: Test documentation navigation checks
        run: python3 -m unittest discover -s dev -p 'test_documentation_*.py' -v
      - name: Build
        run: cmake --build ${{github.workspace}}/build --target RodinDoxygen
      - name: Verify rendered module and template navigation
        run: python3 dev/check_documentation_navigation.py
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: documentation
          path: ${{ github.workspace }}/build/doc/html
          if-no-files-found: error
      - name: Report documentation build outcome
        if: ${{ always() && github.event_name == 'push' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          RUN: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          ATTEMPT: ${{ github.run_attempt }}
          OUTCOME: ${{ job.status }}
        run: |
          status="$OUTCOME"
          if [ "$status" = success ]; then status=queued; fi
          python3 dev/ci_badges.py --documentation-only --branch "$BRANCH" \
            --documentation "$status" --source-run "$RUN" --source-sha "$SHA" \
            --source-attempt "$ATTEMPT"
  PublishDocumentation:
    name: Publish documentation
    needs: Build-And-Deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    concurrency:
      group: rodin-gh-pages-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: Documentation and benchmarks
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Mark documentation publication as running
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          RUN: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python3 dev/ci_badges.py --documentation-only --branch "$BRANCH"
          --documentation running --source-run "$RUN" --source-sha "$SHA"
          --source-attempt "$ATTEMPT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r doc/requirements.txt
      - uses: ./.github/actions/download-artifacts
        with:
          names: '["documentation"]'
          path: documentation-inputs
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .ci-pages
          lfs: false
      - name: Integrate documentation with the latest complete benchmark histories
        env:
          REF: ${{ github.ref }}
        run: python3 dev/benchmark_publish.py --documentation-only --site documentation-inputs/documentation --pages .ci-pages --ref "$REF"
      - name: Publish documentation Pages update
        working-directory: .ci-pages
        env:
          SHA: ${{ github.sha }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish documentation $SHA"
            git push origin HEAD:gh-pages
          fi
      - name: Publish documentation and benchmarks
        id: deployment
        uses: ./.github/actions/publish-pages
        with:
          checkout: .ci-pages
          artifact-name: documentation-pages
      - name: Report documentation deployment outcome
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          RUN: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          ATTEMPT: ${{ github.run_attempt }}
          OUTCOME: ${{ steps.deployment.outcome == 'success' && 'success' || job.status }}
        run: >-
          python3 dev/ci_badges.py --documentation-only --branch "$BRANCH"
          --documentation "$OUTCOME" --source-run "$RUN" --source-sha "$SHA"
          --source-attempt "$ATTEMPT"
