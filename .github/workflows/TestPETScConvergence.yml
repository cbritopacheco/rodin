# Generated by dev/ci_schedule.py --write; edit registration or .github/ci/targeted-lanes.yml.
name: Tests / Dedicated Selection
'on':
  workflow_call:
    inputs:
      matrix:
        type: string
        required: true
    secrets:
      CODECOV_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
jobs:
  PETScConvergence:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    env:
      OMP_NUM_THREADS: 2
      OMP_WAIT_POLICY: PASSIVE
      OPENBLAS_NUM_THREADS: 1
      RODIN_PROFILE_STABILITY: ${{ startsWith(matrix.suite, 'pressure_') && '1' || '0' }}
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: false
        lfs: false
    - name: Start resource monitor
      continue-on-error: true
      run: python3 dev/ci_resource_monitor.py start
    - name: Initialize pinned submodules
      run: python3 dev/ci_submodules.py
    - name: Restore shared test build
      uses: ./.github/actions/test-build
      with:
        job: PETScConvergence
        matrix: ${{ toJSON(matrix) }}
        environment: 'true'
    - name: Run PETSc convergence suite
      if: matrix.suite == 'bulk'
      run: "case \"${{ matrix.context }}\" in\n  local)\n    pattern='^RodinConvergenceHPETSc'\n    context_exclude='|^RodinConvergenceHPETScMPI'\
        \ ;;\n  np1|np2|np3|np4)\n    pattern='^RodinConvergenceHPETScMPI.*_${{ matrix.context }}(_|$)'\n    context_exclude=''\
        \ ;;\n  *) exit 1 ;;\nesac\nctest --test-dir build/tests -R \"$pattern\" \\\n  -E \"^RodinConvergenceHPETSc(Poisson|Conductivity|LinearElasticity|Stokes|ReactionDiffusion|NonlinearPoisson)Boundary_|^RodinConvergenceHPETSc(MPI)?StokesStability_${context_exclude}\"\
        \ \\\n  --output-on-failure --no-tests=error -j 1\n"
    - name: Run PETSc pressure-spectrum suite
      if: startsWith(matrix.suite, 'pressure_')
      run: "case \"${{ matrix.suite }}\" in\n  pressure_light) geometry_pattern='(Triangle|Quadrilateral|Hexahedron|Wedge)'\
        \ ;;\n  pressure_tetrahedron) geometry_pattern='Tetrahedron' ;;\n  pressure_pyramid) geometry_pattern='Pyramid' ;;\n\
        \  *) exit 1 ;;\nesac\nutility_pattern=''\nrank=''\nrank_prefix=''\nprefix='^RodinConvergenceHPETScStokesStability_'\n\
        if [ \"${{ matrix.context }}\" != local ]; then\n  rank=\"${{ matrix.context }}\"\n  rank=\"${rank#np}\"\n  case \"\
        $rank\" in 1|2|3|4) ;; *) exit 1 ;; esac\n  rank_prefix=\"np${rank}_\"\n  prefix='^RodinConvergenceHPETScMPIStokesStability_'\n\
        fi\nif [ \"${{ matrix.suite }}\" = pressure_light ]; then\n  utility_pattern=\"|Utility${rank:+_np$rank}\"\nfi\nstudy=\"\
        ${{ matrix.study }}\"\ncase \"$study\" in\n  all|CoarseAndControls)\n    levels='[345]'\n    if [ \"$study\" = CoarseAndControls\
        \ ]; then levels='[34]'; fi\n    pattern=\"${prefix}(${rank_prefix}${geometry_pattern}|P4P3_${rank_prefix}(Rates_(Affine|Curved)N${levels}|Controls)_${geometry_pattern}${utility_pattern})$\"\
        \ ;;\n  AffineN5|CurvedN5)\n    pattern=\"${prefix}P4P3_${rank_prefix}Rates_${study}_${geometry_pattern}$\" ;;\n \
        \ *) exit 1 ;;\nesac\n# Record existing placement without changing binding or thread policy.\nlscpu\ngrep '^Cpus_allowed_list:'\
        \ /proc/self/status\nprintf 'OMP_NUM_THREADS=%s OPENBLAS_NUM_THREADS=%s\\n' \\\n  \"${OMP_NUM_THREADS:-unset}\" \"\
        ${OPENBLAS_NUM_THREADS:-unset}\"\nctest --test-dir build/tests -R \"$pattern\" --show-only=json-v1 \\\n  | jq '[.tests[]\
        \ | {name, command}]'\nmpi_executable=$(sed -n 's/^MPIEXEC_EXECUTABLE:FILEPATH=//p' build/CMakeCache.txt)\nif [ \"\
        ${{ matrix.context }}\" != local ] && [ -n \"$mpi_executable\" ] \\\n    && \"$mpi_executable\" --version | grep -Eq\
        \ 'Open MPI|OpenRTE'; then\n  if ! \"$mpi_executable\" -n \"$rank\" --oversubscribe --report-bindings \\\n      /bin/sh\
        \ -c 'printf \"MPI rank=%s \" \"$OMPI_COMM_WORLD_RANK\"; grep \"^Cpus_allowed_list:\" /proc/self/status'; then\n \
        \   printf '::warning::MPI placement probe failed; numerical tests still run.\\n'\n  fi\nfi\n# This is a process resource\
        \ report, not summed MPI peak memory or a benchmark.\n/usr/bin/time --verbose ctest --test-dir build/tests -R \"$pattern\"\
        \ \\\n  --output-on-failure --no-tests=error -j 1\n"
    - name: Run PETSc boundary convergence suites
      if: endsWith(matrix.suite, '_boundary')
      run: "case \"${{ matrix.geometry }}\" in\n  light) geometry_pattern='(Segment|Triangle|Quadrilateral|Hexahedron|Wedge)'\
        \ ;;\n  tetrahedron) geometry_pattern='Tetrahedron' ;;\n  pyramid) geometry_pattern='Pyramid' ;;\n  *) exit 1 ;;\n\
        esac\ncontext_pattern=''\nif [ \"${{ matrix.context }}\" != local ]; then context_pattern='MPI_${{ matrix.context\
        \ }}_'; fi\nstudy_pattern='([A-Za-z0-9]+_)?'\ncase \"${{ matrix.study }}\" in\n  all) ;;\n  PureNeumannP1Rates) study_pattern='PureNeumannP1Rates_'\
        \ ;;\n  OtherTetrahedron) study_pattern='((MixedNeumann|Robin)P1Rates|(MixedNeumann|Robin|PureNeumann)P[23]Rates|Controls)_'\
        \ ;;\n  P1Rates|P2Rates|P3Rates) study_pattern='(MixedNeumann|Robin|PureNeumann)${{ matrix.study }}_' ;;\n  Controls)\
        \ study_pattern='Controls_' ;;\n  *) exit 1 ;;\nesac\nctest --test-dir build/tests \\\n  -R \"^RodinConvergenceHPETSc${{\
        \ matrix.physics }}Boundary_${context_pattern}${study_pattern}${geometry_pattern}$\" \\\n  --output-on-failure --no-tests=error\
        \ -j 1\n"
    - name: Publish independent production coverage
      id: coverage_record
      uses: ./.github/actions/coverage
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        definition: '{"job":"${{ github.job }}","matrix":${{ toJSON(matrix) }}}'
    - name: Summarize resource usage
      if: always()
      continue-on-error: true
      run: python3 dev/ci_resource_monitor.py finish
    name: ${{ matrix.path }} (MT=${{ matrix.multithreaded }}, Suite=${{ matrix.suite }}, Context=${{ matrix.context }}, Geometry=${{
      matrix.geometry }}, Study=${{ matrix.study }})
