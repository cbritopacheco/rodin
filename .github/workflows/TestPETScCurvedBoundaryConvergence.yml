# Generated by dev/ci_schedule.py --write; edit registration or .github/ci/targeted-lanes.yml.
name: Tests / Dedicated Selection
'on':
  workflow_call:
    inputs:
      matrix:
        type: string
        required: true
    secrets:
      CODECOV_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
jobs:
  PETScCurvedBoundaryConvergence:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.physics == 'NonlinearPoisson' && 360 || matrix.physics == 'ReactionDiffusion' && 360 || (matrix.physics
      == 'LinearElasticity' && matrix.geometry == 'tetrahedron') && 360 || 240 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    env:
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: false
    - uses: ./.github/actions/prepare-apt
    - name: Setup Cpp
      uses: aminya/setup-cpp@v1
      with:
        compiler: gcc-14
        cmake: true
    - name: Install dependencies
      uses: ./.github/actions/apt-dependencies
      with:
        packages: lcov libboost1.74-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev libmetis-dev libhdf5-dev petsc-dev
          mpich
    - name: Restore shared test build
      uses: ./.github/actions/test-build
      with:
        job: PETScCurvedBoundaryConvergence
        matrix: ${{ toJSON(matrix) }}
    - name: Run curved boundary convergence partition
      run: "case \"${{ matrix.geometry }}\" in\n  tetrahedron) geometry_pattern='Tetrahedron' ;;\n  pyramid) geometry_pattern='Pyramid'\
        \ ;;\n  light) geometry_pattern='(Segment|Triangle|Quadrilateral|Hexahedron|Wedge)' ;;\n  *) exit 1 ;;\nesac\ncase\
        \ \"${{ matrix.selection }}\" in\n  all) context_pattern='(MPI_np[1-4]_)?' ;;\n  local) context_pattern='' ;;\n  np1|np2|np3|np4)\
        \ context_pattern='MPI_${{ matrix.selection }}_' ;;\n  *) exit 1 ;;\nesac\ncase \"${{ matrix.study }}\" in\n  all)\
        \ study_pattern='([A-Za-z][A-Za-z0-9]*_)?' ;;\n  MixedNeumannP[123]Rates|RobinP[123]Rates|PureNeumannP[123]Rates)\
        \ study_pattern='${{ matrix.study }}_' ;;\n  Controls) study_pattern='Controls_' ;;\n  *) exit 1 ;;\nesac\nctest --test-dir\
        \ build/tests \\\n  -R \"^RodinConvergenceIsoparametricPETSc${{ matrix.physics }}Boundary_${context_pattern}${study_pattern}${geometry_pattern}$\"\
        \ \\\n  --output-on-failure --no-tests=error -j 1\n"
    - name: Publish independent production coverage
      id: coverage_record
      uses: ./.github/actions/coverage
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        definition: '{"job":"${{ github.job }}","matrix":${{ toJSON(matrix) }}}'
    name: ${{ matrix.path }} (MT=${{ matrix.multithreaded }}, Physics=${{ matrix.physics }}, Geometry=${{ matrix.geometry
      }}, Selection=${{ matrix.selection }}, Study=${{ matrix.study }})
