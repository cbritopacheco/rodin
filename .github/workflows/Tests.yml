            path: Convergence / p-hp / PETSc / LinearElasticity
    env:
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: gcc-14
          cmake: true
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y lcov libboost1.74-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev libmetis-dev libhdf5-dev
          petsc-dev mpich
      - name: Configure PETSc degree-refinement build
        run: cmake -S . -B build -DRODIN_CODE_COVERAGE=ON -DRODIN_LCOV_FLAGS="--ignore-errors gcov,gcov --ignore-errors mismatch --ignore-errors unused" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRODIN_BUILD_SRC=ON -DRODIN_BUILD_UNIT_TESTS=OFF -DRODIN_BUILD_MANUFACTURED_TESTS=OFF
          -DRODIN_BUILD_CONVERGENCE_TESTS=ON -DRODIN_BUILD_EXAMPLES=OFF -DRODIN_BUILD_BENCHMARKS=OFF -DRODIN_INSTALL_RESOURCES=OFF -DRODIN_MULTITHREADED=${{
          matrix.multithreaded }} -DRODIN_USE_MPI=ON -DRODIN_USE_PETSC=ON
      - name: Build PETSc degree-refinement suites
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
        run: |
          if [ "${{ matrix.suite }}" = linear_elasticity ]; then
            cmake --build build -j 2 --target \
              RodinConvergencePPETScLinearElasticity \
              RodinConvergenceHPPETScLinearElasticity
          else
            cmake --build build -j 2 --target \
              RodinConvergencePPETScNonlinearPoisson \
              RodinConvergenceHPPETScNonlinearPoisson \
              RodinConvergencePPETScReactionDiffusion \
              RodinConvergenceHPPETScReactionDiffusion \
              RodinConvergencePPETScPoisson RodinConvergenceHPPETScPoisson \
              RodinConvergencePPETScConductivity RodinConvergenceHPPETScConductivity \
              RodinConvergencePPETScStokes RodinConvergenceHPPETScStokes
          fi
      - name: Run PETSc degree-refinement suites
        run: |
          if [ "${{ matrix.suite }}" = linear_elasticity ]; then
            ctest --test-dir build/tests \
              -R '^RodinConvergence(P|HP)PETScLinearElasticity_' \
              --output-on-failure -j 1
          else
            ctest --test-dir build/tests -R '^RodinConvergence(P|HP)PETSc' \
              -E 'LinearElasticity' --output-on-failure -j 1
          fi
      - name: Publish independent production coverage
        id: coverage_record
        uses: ./.github/actions/coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          definition: '{"job":"${{ github.job }}","matrix":${{ toJSON(matrix) }}}'
          artifact_name: ci-target-${{ github.job }}-${{ strategy.job-index }}

    name: ${{ matrix.path }} (multithreaded=${{ matrix.multithreaded }}, suite=${{ matrix.suite }})
