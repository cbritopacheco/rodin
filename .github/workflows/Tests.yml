          - {multithreaded: 'OFF', suite: nonlinear_boundary, context: np3, geometry: pyramid, study: P1Rates, physics: NonlinearPoisson, path: Convergence / H / PETScNonlinearPoisson / BoundaryConditions}
          - {multithreaded: 'OFF', suite: nonlinear_boundary, context: np3, geometry: pyramid, study: P2Rates, physics: NonlinearPoisson, path: Convergence / H / PETScNonlinearPoisson / BoundaryConditions}
          - {multithreaded: 'OFF', suite: nonlinear_boundary, context: np3, geometry: pyramid, study: P3Rates, physics: NonlinearPoisson, path: Convergence / H / PETScNonlinearPoisson / BoundaryConditions}
          - {multithreaded: 'OFF', suite: nonlinear_boundary, context: np3, geometry: pyramid, study: Controls, physics: NonlinearPoisson, path: Convergence / H / PETScNonlinearPoisson / BoundaryConditions}
