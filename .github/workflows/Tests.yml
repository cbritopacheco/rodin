    env:
      OMP_NUM_THREADS: 2
      OMP_WAIT_POLICY: PASSIVE
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: gcc-14
          cmake: true
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y lcov libboost1.74-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev libmetis-dev libhdf5-dev
          petsc-dev mpich
      - name: Restore shared test build
        uses: ./.github/actions/test-build
        with:
          job: PETScCurvedConvergence
          matrix: ${{ toJSON(matrix) }}
      - name: Run curved PETSc convergence suites
        run: |
          physics_pattern='${{ matrix.physics }}'
          if [ "${{ matrix.physics }}" = Diffusion ]; then
            physics_pattern='(Approximated|Lifted|SmoothLifted)?Diffusion'
          fi
          case "${{ matrix.geometry }}" in
            tetrahedron) geometry_pattern='Tetrahedron' ;;
            pyramid) geometry_pattern='Pyramid' ;;
            light) geometry_pattern='(Segment|Triangle|Quadrilateral|Hexahedron|Wedge)' ;;
            *) exit 1 ;;
          esac
          case "${{ matrix.selection }}" in
            all) context_pattern='(MPI)?'; rank_pattern='.*' ;;
            local) context_pattern=''; rank_pattern='.*' ;;
            np1|np2|np3|np4) context_pattern='MPI'; rank_pattern=".*${{ matrix.selection }}_" ;;
            *) exit 1 ;;
          esac
          partition_pattern='.*'
          exclude_pattern='a^'
          case "${{ matrix.partition }}" in
            all) ;;
            Lifted) partition_pattern='Q[13]Test_LiftedAffineRates_' ;;
            Controls) exclude_pattern='Rates_' ;;
            *) partition_pattern='Test_${{ matrix.partition }}Rates_' ;;
          esac
          ctest --test-dir build/tests \
            -R "^RodinConvergenceIsoparametricPETSc${context_pattern}${physics_pattern}_${rank_pattern}${partition_pattern}${geometry_pattern}$" \
            -E "$exclude_pattern" --output-on-failure --no-tests=error -j 1
      - name: Publish independent production coverage
        id: coverage_record
        uses: ./.github/actions/coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          definition: '{"job":"${{ github.job }}","matrix":${{ toJSON(matrix) }}}'
          artifact_name: ci-target-${{ github.job }}-${{ strategy.job-index }}

    name: ${{ matrix.path }} (MT=${{ matrix.multithreaded }}, Suite=${{ matrix.suite }}, Geometry=${{ matrix.geometry }}, Selection=${{
      matrix.selection }}, Physics=${{ matrix.physics }}, Partition=${{ matrix.partition }})
