      OMPI_MCA_hwloc_base_binding_policy: none
      OMPI_MCA_mpi_yield_when_idle: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: gcc-14
          cmake: true
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y lcov libboost-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev libmetis-dev libhdf5-dev
          lcov libomp-dev mpi-default-bin mpi-default-dev
      - name: Configure native MPI restriction build
        run: cmake -S . -B build -DRODIN_CODE_COVERAGE=ON -DRODIN_LCOV_FLAGS="--ignore-errors gcov,gcov --ignore-errors mismatch --ignore-errors unused" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRODIN_BUILD_SRC=ON -DRODIN_BUILD_UNIT_TESTS=ON -DRODIN_BUILD_MANUFACTURED_TESTS=OFF
          -DRODIN_BUILD_CONVERGENCE_TESTS=OFF -DRODIN_BUILD_EXAMPLES=OFF -DRODIN_BUILD_BENCHMARKS=OFF -DRODIN_INSTALL_RESOURCES=OFF -DRODIN_USE_MPI=ON
          -DRODIN_USE_PETSC=OFF -DRODIN_MULTITHREADED=${{ matrix.multithreaded }}
      - name: Build native MPI restriction suite
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
        run: cmake --build build -j 2 --target RodinMPISubMeshGridFunctionTest
      - name: Record native MPI CPU placement
        env:
          MPI_RANKS: ${{ matrix.np }}
        run: |
          lscpu
          grep '^Cpus_allowed_list:' /proc/self/status
          mpi_executable=$(sed -n 's/^MPIEXEC_EXECUTABLE:FILEPATH=//p' build/CMakeCache.txt)
          if [ -n "$mpi_executable" ] && "$mpi_executable" --version | grep -Eq 'Open MPI|OpenRTE'; then
            "$mpi_executable" -n "$MPI_RANKS" --oversubscribe --report-bindings \
              /bin/sh -c 'printf "MPI rank=%s " "$OMPI_COMM_WORLD_RANK"; grep "^Cpus_allowed_list:" /proc/self/status'
          fi
      - name: Run native MPI restriction rank partition
        run: ctest --test-dir build/tests -R '^RodinMPIH1SubMeshRestrictionTest_${{ matrix.geometry }}_.*_np${{ matrix.np }}$' --no-tests=error --output-on-failure -j 1
      - name: Publish independent production coverage
        id: coverage_record
        uses: ./.github/actions/coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          definition: '{"job":"${{ github.job }}","matrix":${{ toJSON(matrix) }}}'
          artifact_name: ci-target-${{ github.job }}-${{ strategy.job-index }}

