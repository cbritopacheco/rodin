        with:
          compiler: gcc-14
          cmake: true
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y lcov libboost1.74-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev libmetis-dev libhdf5-dev
          petsc-dev mpich
      - name: Configure curved PETSc convergence build
        run: cmake -S . -B build -DRODIN_CODE_COVERAGE=ON -DRODIN_LCOV_FLAGS="--ignore-errors gcov,gcov --ignore-errors mismatch --ignore-errors unused" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRODIN_BUILD_SRC=ON -DRODIN_BUILD_UNIT_TESTS=OFF -DRODIN_BUILD_MANUFACTURED_TESTS=OFF
          -DRODIN_BUILD_CONVERGENCE_TESTS=ON -DRODIN_BUILD_EXAMPLES=OFF -DRODIN_BUILD_BENCHMARKS=OFF -DRODIN_INSTALL_RESOURCES=OFF -DRODIN_MULTITHREADED=${{
          matrix.multithreaded }} -DRODIN_USE_MPI=ON -DRODIN_USE_PETSC=ON
      - name: Build curved PETSc convergence suites
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
        run: |
          case "${{ matrix.suite }}" in
            scalar)
              cmake --build build -j 2 --target \
                RodinConvergenceIsoparametricPETScReactionDiffusion \
                RodinConvergenceIsoparametricPETScNonlinearPoisson \
                RodinConvergenceIsoparametricPETScP0Projection \
                RodinConvergenceIsoparametricPETScDiffusion \
                RodinConvergenceIsoparametricPETScGeometryApproximation ;;
            linear_elasticity)
              cmake --build build -j 2 --target RodinConvergenceIsoparametricPETScLinearElasticity ;;
            stokes)
              cmake --build build -j 2 --target RodinConvergenceIsoparametricPETScStokes ;;
            *) exit 1 ;;
          esac
      - name: Run curved PETSc convergence suites
        run: |
          case "${{ matrix.suite }}" in
            scalar) physics_pattern='(ReactionDiffusion|NonlinearPoisson|P0Projection|Diffusion|ApproximatedDiffusion|LiftedDiffusion|SmoothLiftedDiffusion|GeometryApproximation)' ;;
