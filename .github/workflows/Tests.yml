    name: ${{ matrix.path }} (MT=${{ matrix.multithreaded }}, Selection=${{ matrix.selection }}, Partition=${{ matrix.partition }})
  PETScComplexConvergence:
    needs:
      - Plan
      - DirectoryComplex1
      - DirectoryComplex2
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.suite == 'curved_boundary' && 240 || startsWith(matrix.suite, 'curved_helmholtz') && 180 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {multithreaded: 'ON', suite: bulk, path: Convergence / H / PETSc / Complex, context: all}
          - {multithreaded: 'ON', suite: curved_helmholtz_light, path: Convergence / Isoparametric / PETSc / Complex, context: all}
          - {multithreaded: 'ON', suite: curved_helmholtz_tetrahedron, path: Convergence / Isoparametric / PETSc / Complex, context: all}
          - {multithreaded: 'ON', suite: curved_helmholtz_pyramid, path: Convergence / Isoparametric / PETSc / Complex, context: all}
          - {multithreaded: 'ON', suite: curved_projection, path: Convergence / Isoparametric / PETSc / Complex, context: all}
          - {multithreaded: 'ON', suite: boundary, path: Convergence / H / PETSc / BoundaryConditions / Complex, context: local}
          - {multithreaded: 'ON', suite: boundary, path: Convergence / H / PETSc / BoundaryConditions / Complex, context: np1}
          - {multithreaded: 'ON', suite: boundary, path: Convergence / H / PETSc / BoundaryConditions / Complex, context: np2}
          - {multithreaded: 'ON', suite: boundary, path: Convergence / H / PETSc / BoundaryConditions / Complex, context: np3}
          - {multithreaded: 'ON', suite: boundary, path: Convergence / H / PETSc / BoundaryConditions / Complex, context: np4}
          - {multithreaded: 'ON', suite: curved_boundary, path: Convergence / Isoparametric / PETSc / BoundaryConditions / Complex, context: all}
          - {multithreaded: 'ON', suite: submesh, path: Unit / Rodin / PETSc / H1Restriction / Slow, context: all}
          - {multithreaded: 'OFF', suite: bulk, path: Convergence / H / PETSc / Complex, context: all}
          - {multithreaded: 'OFF', suite: curved_helmholtz_light, path: Convergence / Isoparametric / PETSc / Complex, context: all}
          - {multithreaded: 'OFF', suite: curved_helmholtz_tetrahedron, path: Convergence / Isoparametric / PETSc / Complex, context: all}
          - {multithreaded: 'OFF', suite: curved_helmholtz_pyramid, path: Convergence / Isoparametric / PETSc / Complex, context: all}
          - {multithreaded: 'OFF', suite: curved_projection, path: Convergence / Isoparametric / PETSc / Complex, context: all}
          - {multithreaded: 'OFF', suite: boundary, path: Convergence / H / PETSc / BoundaryConditions / Complex, context: local}
          - {multithreaded: 'OFF', suite: boundary, path: Convergence / H / PETSc / BoundaryConditions / Complex, context: np1}
          - {multithreaded: 'OFF', suite: boundary, path: Convergence / H / PETSc / BoundaryConditions / Complex, context: np2}
          - {multithreaded: 'OFF', suite: boundary, path: Convergence / H / PETSc / BoundaryConditions / Complex, context: np3}
          - {multithreaded: 'OFF', suite: boundary, path: Convergence / H / PETSc / BoundaryConditions / Complex, context: np4}
          - {multithreaded: 'OFF', suite: curved_boundary, path: Convergence / Isoparametric / PETSc / BoundaryConditions / Complex, context: all}
          - {multithreaded: 'OFF', suite: submesh, path: Unit / Rodin / PETSc / H1Restriction / Slow, context: all}
    env:
      GCOV: gcov-14
      RODIN_COVERAGE: ${{ matrix.suite == 'submesh' && 'ON' || 'OFF' }}
      OMP_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: gcc-14
          cmake: true
      - name: Install complex PETSc dependencies
        run: sudo apt-get update && sudo apt-get install -y lcov libboost1.74-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev libmetis-dev libhdf5-dev
          libomp-dev libpetsc-complex3.19-dev openmpi-bin libopenmpi-dev pkg-config lcov
      - name: Restore shared test build
        uses: ./.github/actions/test-build
        with:
          job: PETScComplexConvergence
          matrix: ${{ toJSON(matrix) }}
      - name: Run complex PETSc convergence suite
        if: matrix.suite == 'bulk'
        run: ctest --test-dir build/tests -R 'RodinConvergence(H|P|HP)PETSc(MPI)?Helmholtz|RodinPETScSNESStateTest|RodinPETSc(MPI)?ScalarIntegralTest|Rodin_Variational_Integral'
          -E '^RodinConvergenceHPETScHelmholtzBoundary_' --output-on-failure --no-tests=error -j 1
      - name: Run curved complex PETSc Helmholtz suite
        if: startsWith(matrix.suite, 'curved_helmholtz')
        run: |
          case "${{ matrix.suite }}" in
            curved_helmholtz_light) geometry_pattern='(Segment|Triangle|Quadrilateral|Hexahedron|Wedge)' ;;
            curved_helmholtz_tetrahedron) geometry_pattern='Tetrahedron' ;;
            curved_helmholtz_pyramid) geometry_pattern='Pyramid' ;;
            *) exit 1 ;;
          esac
          ctest --test-dir build/tests \
            -R "^RodinConvergenceIsoparametricPETSc(MPI)?Helmholtz_.*${geometry_pattern}$" \
            --output-on-failure --no-tests=error -j 1
      - name: Run curved complex PETSc projection suite
        if: matrix.suite == 'curved_projection'
        run: ctest --test-dir build/tests -R '^RodinConvergenceIsoparametricPETSc(MPI)?P0Projection_' --output-on-failure --no-tests=error -j
          1
      - name: Run complex PETSc Helmholtz boundary suite
        if: matrix.suite == 'boundary'
        run: |
          context_pattern=''
          if [ "${{ matrix.context }}" != local ]; then context_pattern='MPI_${{ matrix.context }}_'; fi
          ctest --test-dir build/tests -R "^RodinConvergenceHPETScHelmholtzBoundary_${context_pattern}[A-Za-z]+$" \
            --output-on-failure --no-tests=error -j 1
      - name: Discover coverage tests without runtime profiles
        if: matrix.suite == 'submesh'
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
        run: |
          mkdir -p coverage-discovery-excluded
          ctest --test-dir build/tests --show-only=json-v1 > coverage-discovery-excluded/tests.json
      - name: Run complex PETSc SubMesh restriction matrix
        if: matrix.suite == 'submesh'
        env:
          OMP_WAIT_POLICY: PASSIVE
          OPENBLAS_NUM_THREADS: 1
          OMPI_MCA_hwloc_base_binding_policy: none
        run: ctest --test-dir build/tests -R '^RodinPETScMPIH1SubMeshRestrictionTest_np(1|2|3|4|8)_(Segment|Triangle|Quadrilateral|Tetrahedron|Pyramid|Hexahedron|Wedge)_(Affine|Curved)_K[1-6]$'
          --output-on-failure --no-tests=error -j 1
      - name: Retain complex H1 restriction diagnostics
        if: always() && matrix.suite == 'submesh'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: petsc-complex-h1-restriction-diagnostics-mt${{ matrix.multithreaded }}
          path: |
            build/tests/Testing/Temporary/LastTest.log
            build/tests/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
      - name: Run curved complex PETSc Helmholtz boundary suite
        if: matrix.suite == 'curved_boundary'
        run: ctest --test-dir build/tests -R '^RodinConvergenceIsoparametricPETScHelmholtzBoundary_' --output-on-failure --no-tests=error -j 1
      - name: Publish independent production coverage
        id: coverage_record
        uses: ./.github/actions/coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          definition: '{"job":"${{ github.job }}","matrix":${{ toJSON(matrix) }}}'
          artifact_name: ci-target-${{ github.job }}-${{ strategy.job-index }}

    name: ${{ matrix.path }} (MT=${{ matrix.multithreaded }}, Suite=${{ matrix.suite }}, Context=${{ matrix.context }})
  PETScMatrixRanges:
    needs:
      - Plan
      - DirectoryMatrixRangesReal1
      - DirectoryMatrixRangesReal2
      - DirectoryMatrixRangesComplex1
      - DirectoryMatrixRangesComplex2
    runs-on: ubuntu-latest
    # Package provisioning and instrumented compilation can consume 45 minutes
    # before the serial test matrix finishes. Keep individual CTest watchdogs.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - scalar: real
            multithreaded: 'ON'
            path: Unit / Rodin / PETSc / MatrixRanges
          - scalar: real
            multithreaded: 'OFF'
            path: Unit / Rodin / PETSc / MatrixRanges
          - scalar: complex
            multithreaded: 'ON'
            path: Unit / Rodin / PETSc / MatrixRanges
          - scalar: complex
            multithreaded: 'OFF'
            path: Unit / Rodin / PETSc / MatrixRanges
    env:
      GCOV: gcov-14
      OMP_NUM_THREADS: 2
      OMP_WAIT_POLICY: PASSIVE
      OMPI_MCA_hwloc_base_binding_policy: none
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: gcc-14
          cmake: true
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y lcov libboost1.74-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev libmetis-dev libhdf5-dev
          libpetsc-${{ matrix.scalar }}-dev libomp-dev mpi-default-dev lcov
      - uses: ./.github/actions/test-build
        with:
          job: PETScMatrixRanges
          matrix: ${{ toJSON(matrix) }}
      - name: Discover coverage tests without runtime profiles
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
        run: |
          mkdir -p coverage-discovery-excluded
          ctest --test-dir build/tests --show-only=json-v1 > coverage-discovery-excluded/tests.json
      - name: Run PETSc matrix-range and I/O tests
        run: ctest --test-dir build/tests -R '^(RodinMPIMatrixRangeTest_np[1-4]|RodinPETScGridFunctionTest|RodinPETScMPIGridFunctionTest_np[1-4]|RodinPETScMPIP0P0gTest_np[1-4]|RodinPETScMPISubMeshGridFunctionTest_np[124]|RodinPETScIO(HDF5IO|MEDITIO|MFEMIO)Test|RodinPETScIOMFEMMPIIOTest_np[12348]|RodinPETScSingleFieldConstraintTest|RodinPETScRestrictedNonlocalTest|RodinPETScMixedTargetAssemblyTest|RodinPETScMPIMixedTargetAssemblyTest_np[12348]|RodinPETScSingleFieldTargetAssemblyTest|RodinPETScSNESStateTest)$'
          --output-on-failure --no-tests=error -j 1
      - name: Publish independent production coverage
        id: coverage_record
        uses: ./.github/actions/coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          definition: '{"job":"${{ github.job }}","matrix":${{ toJSON(matrix) }}}'
          artifact_name: ci-target-${{ github.job }}-${{ strategy.job-index }}

    name: ${{ matrix.path }} (Scalar=${{ matrix.scalar }}, MT=${{ matrix.multithreaded }})
  InstallationUbuntu:
    needs:
      - Plan
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
        compiler:
          - gcc-12
          - gcc-13
          - gcc-14
        mpi:
          - 'ON'
          - 'OFF'
        petsc:
          - 'ON'
          - 'OFF'
      fail-fast: false
    env:
      MAKEFLAGS: -j2
      RODIN_INSTALL_RESOURCES: 'OFF'
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - name: Setup Cpp (C++ / C)
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.compiler }}
          cmake: true
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev libmetis-dev libhdf5-dev
          libomp-dev petsc-dev mpich lcov
      - name: Run installation test
        run: bash tests/installation/test_installation.sh
        env:
          RODIN_USE_MPI: ${{ matrix.mpi }}
          RODIN_USE_PETSC: ${{ matrix.petsc }}
          RODIN_INSTALL_RESOURCES: ${{ env.RODIN_INSTALL_RESOURCES }}
      - name: Archive installation artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: installation-test-failure-${{ matrix.compiler }}-mpi${{ matrix.mpi }}-petsc${{ matrix.petsc }}
          path: |
            build/install-test/
            build/test-installation-project/
          retention-days: 7
    name: Installation / Ubuntu (OS=${{ matrix.os }}, Compiler=${{ matrix.compiler }}, MPI=${{ matrix.mpi }}, PETSc=${{ matrix.petsc }})
  InstallationMacOS:
    needs:
      - Plan
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
        mpi:
          - 'ON'
          - 'OFF'
        petsc:
          - 'ON'
          - 'OFF'
      fail-fast: false
    env:
      MAKEFLAGS: -j2
      RODIN_INSTALL_RESOURCES: 'OFF'
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - name: Setup Python
        run: |
          brew list -1 | grep python | while read formula; do brew unlink $formula; brew link --overwrite $formula; done || true
      - name: Update Homebrew
        run: brew update
      - name: Install dependencies
        run: |
          BREW_PACKAGES="boost boost-mpi eigen libomp"
          if [ "${{ matrix.petsc }}" = "ON" ]; then
            BREW_PACKAGES="$BREW_PACKAGES petsc hdf5-mpi"
          elif [ "${{ matrix.mpi }}" = "ON" ]; then
            BREW_PACKAGES="$BREW_PACKAGES open-mpi hdf5-mpi"
          else
            BREW_PACKAGES="$BREW_PACKAGES hdf5"
          fi
          brew install $BREW_PACKAGES
      - name: Link libomp
        run: |
          brew link --force --overwrite libomp
      - name: Verify dependencies
        run: |
          echo "Boost location:"
          brew --prefix boost
          echo "Eigen location:"
          brew --prefix eigen
          echo "OpenMP location:"
          brew --prefix libomp
          if [ "${{ matrix.petsc }}" = "ON" ]; then
            echo "PETSc location:"
            brew --prefix petsc
          fi
          if [ "${{ matrix.mpi }}" = "ON" ]; then
            echo "MPI location:"
            brew --prefix open-mpi 2>/dev/null || brew --prefix petsc
          fi
      - name: Run installation test
        run: bash tests/installation/test_installation.sh
        env:
          RODIN_USE_MPI: ${{ matrix.mpi }}
          RODIN_USE_PETSC: ${{ matrix.petsc }}
          RODIN_INSTALL_RESOURCES: ${{ env.RODIN_INSTALL_RESOURCES }}
      - name: Archive installation artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: installation-test-failure-macos-mpi${{ matrix.mpi }}-petsc${{ matrix.petsc }}
          path: |
            build/install-test/
            build/test-installation-project/
          retention-days: 7
    name: Installation / MacOS (OS=${{ matrix.os }}, MPI=${{ matrix.mpi }}, PETSc=${{ matrix.petsc }})
