      OMP_WAIT_POLICY: PASSIVE
      OMPI_MCA_hwloc_base_binding_policy: none
      OMPI_MCA_mpi_yield_when_idle: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: gcc-14
          cmake: true
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y lcov libboost-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev libmetis-dev libhdf5-dev
          lcov libomp-dev mpi-default-bin mpi-default-dev
      - name: Restore shared test build
        uses: ./.github/actions/test-build
        with:
          job: MPIH1Restriction
          matrix: ${{ toJSON(matrix) }}
      - name: Record native MPI CPU placement
        env:
          MPI_RANKS: ${{ matrix.np }}
        run: |
          lscpu
          grep '^Cpus_allowed_list:' /proc/self/status
          mpi_executable=$(sed -n 's/^MPIEXEC_EXECUTABLE:FILEPATH=//p' build/CMakeCache.txt)
          if [ -n "$mpi_executable" ] && "$mpi_executable" --version | grep -Eq 'Open MPI|OpenRTE'; then
            "$mpi_executable" -n "$MPI_RANKS" --oversubscribe --report-bindings \
              /bin/sh -c 'printf "MPI rank=%s " "$OMPI_COMM_WORLD_RANK"; grep "^Cpus_allowed_list:" /proc/self/status'
          fi
