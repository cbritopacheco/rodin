name: Tests

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: Tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        multithreaded: [ON, OFF]
    env:
      OMP_NUM_THREADS: 2

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: gcc-14
          cmake: true

      - name: Install dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libboost1.74-all-dev
          libsuitesparse-dev
          libeigen3-dev
          libscotch-dev
          libmetis-dev
          libhdf5-dev
          libomp-dev

      - name: Configure convergence build
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DRODIN_BUILD_SRC=ON
          -DRODIN_BUILD_UNIT_TESTS=OFF
          -DRODIN_BUILD_MANUFACTURED_TESTS=OFF
          -DRODIN_BUILD_CONVERGENCE_TESTS=ON
          -DRODIN_BUILD_EXAMPLES=OFF
          -DRODIN_BUILD_BENCHMARKS=OFF
          -DRODIN_INSTALL_RESOURCES=OFF
          -DRODIN_USE_MPI=OFF
          -DRODIN_USE_PETSC=OFF
          -DRODIN_MULTITHREADED=${{ matrix.multithreaded }}

      - name: Build convergence suites
        run: cmake --build build -j 2

      - name: Run convergence suites
        run: >-
          ctest --test-dir build/tests -L convergence
          --output-on-failure -j 2

  PETScConvergence:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: gcc-14
          cmake: true

      - name: Install dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libboost1.74-all-dev
          libsuitesparse-dev
          libeigen3-dev
          libscotch-dev
          libmetis-dev
          libhdf5-dev
          petsc-dev
          mpich

      - name: Configure PETSc convergence build
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DRODIN_BUILD_SRC=ON
          -DRODIN_BUILD_UNIT_TESTS=OFF
          -DRODIN_BUILD_MANUFACTURED_TESTS=OFF
          -DRODIN_BUILD_CONVERGENCE_TESTS=ON
          -DRODIN_BUILD_EXAMPLES=OFF
          -DRODIN_BUILD_BENCHMARKS=OFF
          -DRODIN_INSTALL_RESOURCES=OFF
          -DRODIN_MULTITHREADED=OFF
          -DRODIN_USE_MPI=ON
          -DRODIN_USE_PETSC=ON

      - name: Build PETSc convergence suite
        run: >-
          cmake --build build -j 2 --target
          RodinConvergenceHPETScPoisson
          RodinConvergenceHPETScMPIPoisson

      - name: Run PETSc convergence suite
        run: >-
          ctest --test-dir build/tests -R RodinConvergenceHPETSc
          --output-on-failure -j 1

  Unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc-14]
        build_type: [Debug, Release]
        multithreaded: [ON, OFF]
        asan: [ON, OFF]
        ubsan: [ON, OFF]
      fail-fast: false

    env:
      MAKEFLAGS: "-j2"
      OMP_NUM_THREADS: 2
      CTEST_PARALLEL_LEVEL: 2
      # A standalone Ubuntu/Open MPI repro reports PMIx leaks under ASan even
      # without MUMPS, including when MPI_Finalize is called. Keep MUMPS out
      # of ASan jobs while testing it under UBSan and the SuiteSparse solvers
      # under both sanitizers.
      RODIN_MUMPS: ${{ matrix.asan == 'OFF' && 'ON' || 'OFF' }}
      # The runner image packages SuiteSparse 7.6, whose ParU has no ParU.h.
      # The ParU solver needs the C API of SuiteSparse 7.10 or newer, so those
      # entries build SuiteSparse themselves and configure against it.
      SUITESPARSE_VERSION: "7.14.1"
      SUITESPARSE_PREFIX: ${{ github.workspace }}/suitesparse

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - name: Hydrate test resources
        run: >-
          git lfs pull
          --include="resources/medit/Square.medit.mesh,resources/mfem/Square.mfem.mesh,resources/mfem/SquareWithHole.mfem.mesh,resources/mfem/StarSquare.mfem.mesh,resources/examples/ShapeOptimization/LevelSetCantilever2D.mfem.mesh,resources/tests/mfem/h1/**"

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Setup Cpp (C++ / C)
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.compiler }}
          cmake: true

      - name: Install dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libboost1.74-all-dev
          libsuitesparse-dev
          libeigen3-dev
          libscotch-dev
          libmetis-dev
          libhdf5-dev
          libmumps-dev
          libmumps-headers-dev
          libomp-dev
          mpi-default-bin
          mpi-default-dev
          petsc-dev
          mpich
          lcov

      - name: Restore SuiteSparse
        id: suitesparse
        uses: actions/cache@v4
        with:
          path: ${{ env.SUITESPARSE_PREFIX }}
          key: suitesparse-${{ env.SUITESPARSE_VERSION }}-${{ runner.os }}-${{ matrix.compiler }}

      - name: Build SuiteSparse
        if: steps.suitesparse.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/DrTimothyAldenDavis/SuiteSparse/archive/refs/tags/v${SUITESPARSE_VERSION}.tar.gz" | tar xz
          cmake -S "SuiteSparse-${SUITESPARSE_VERSION}" -B suitesparse-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${SUITESPARSE_PREFIX}" \
            -DSUITESPARSE_ENABLE_PROJECTS="suitesparse_config;amd;camd;colamd;ccolamd;cholmod;umfpack;spqr;paru" \
            -DSUITESPARSE_USE_CUDA=OFF \
            -DSUITESPARSE_USE_FORTRAN=OFF \
            -DSUITESPARSE_DEMOS=OFF
          cmake --build suitesparse-build
          cmake --install suitesparse-build

      - name: Configure CMake
        run: >
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DRODIN_USE_MPI=ON
          -DRODIN_USE_PETSC=ON
          -DRODIN_USE_ASAN=${{ matrix.asan }}
          -DRODIN_USE_UBSAN=${{ matrix.ubsan }}
          -DCMAKE_PREFIX_PATH=${{ env.SUITESPARSE_PREFIX }}
          -DRODIN_USE_CHOLMOD=ON
          -DRODIN_USE_MUMPS=${{ env.RODIN_MUMPS }}
          -DRODIN_USE_PARU=ON
          -DRODIN_USE_SPQR=ON
          -DRODIN_USE_UMFPACK=ON
          -DRODIN_BUILD_DOC=OFF
          -DRODIN_INSTALL_RESOURCES=OFF
          -DRODIN_USE_MCSS=OFF
          -DRODIN_BUILD_EXAMPLES=OFF
          -DRODIN_BUILD_BENCHMARKS=OFF
          -DRODIN_BUILD_SRC=ON
          -DRODIN_BUILD_UNIT_TESTS=ON
          -DRODIN_BUILD_MANUFACTURED_TESTS=ON
          -DRODIN_CODE_COVERAGE=OFF
          -DRODIN_MULTITHREADED=${{ matrix.multithreaded }}

      - name: Build
        run: cmake --build ${{ github.workspace }}/build

      - name: Run unit tests
        run: >
          ctest --test-dir ${{ github.workspace }}/build/tests
          -L unit -LE "slow|distributed"
          --output-on-failure
          -j ${{ env.CTEST_PARALLEL_LEVEL }}

      - name: Rerun failed unit tests (verbose)
        if: failure()
        run: >
          ctest --test-dir ${{ github.workspace }}/build/tests
          -L unit -LE "slow|distributed"
          --rerun-failed -V --output-on-failure

      - name: Run distributed tests
        run: >
          ctest --test-dir ${{ github.workspace }}/build/tests
          -L unit -L distributed -LE slow
          --output-on-failure
          -j 1

      - name: Rerun failed distributed tests (verbose)
        if: failure()
        run: >
          ctest --test-dir ${{ github.workspace }}/build/tests
          -L unit -L distributed -LE slow
          --rerun-failed -V --output-on-failure

  Manufactured:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc-14]
        build_type: [Debug, Release]
        multithreaded: [ON, OFF]
        asan: [ON, OFF]
        ubsan: [ON, OFF]
      fail-fast: false

    env:
      MAKEFLAGS: "-j2"
      OMP_NUM_THREADS: 2
      CTEST_PARALLEL_LEVEL: 1

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Setup Cpp (C++ / C)
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.compiler }}
          cmake: true

      - name: Install dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libboost1.74-all-dev
          libsuitesparse-dev
          libeigen3-dev
          libscotch-dev
          libmetis-dev
          libhdf5-dev
          libomp-dev
          petsc-dev
          mpich
          lcov

      - name: Configure CMake
        run: >
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DRODIN_USE_MPI=ON
          -DRODIN_USE_PETSC=ON
          -DRODIN_USE_ASAN=${{ matrix.asan }}
          -DRODIN_USE_UBSAN=${{ matrix.ubsan }}
          -DRODIN_BUILD_DOC=OFF
          -DRODIN_INSTALL_RESOURCES=OFF
          -DRODIN_USE_MCSS=OFF
          -DRODIN_BUILD_EXAMPLES=OFF
          -DRODIN_BUILD_BENCHMARKS=OFF
          -DRODIN_BUILD_SRC=ON
          -DRODIN_BUILD_UNIT_TESTS=ON
          -DRODIN_BUILD_MANUFACTURED_TESTS=ON
          -DRODIN_CODE_COVERAGE=OFF
          -DRODIN_MULTITHREADED=${{ matrix.multithreaded }}

      - name: Build
        run: cmake --build ${{ github.workspace }}/build

      - name: Run manufactured tests
        run: >
          ctest --test-dir ${{ github.workspace }}/build/tests
          -L manufactured -LE "slow|distributed"
          --output-on-failure
          -j ${{ env.CTEST_PARALLEL_LEVEL }}

      - name: Rerun failed manufactured tests (verbose)
        if: failure()
        run: >
          ctest --test-dir ${{ github.workspace }}/build/tests
          -L manufactured -LE "slow|distributed"
          --rerun-failed -V --output-on-failure

      - name: Run manufactured distributed tests
        run: >
          ctest --test-dir ${{ github.workspace }}/build/tests
          -L manufactured -L distributed -LE slow
          --output-on-failure
          -j 1

      - name: Rerun failed manufactured distributed tests (verbose)
        if: failure()
        run: >
          ctest --test-dir ${{ github.workspace }}/build/tests
          -L manufactured -L distributed -LE slow
          --rerun-failed -V --output-on-failure

  Slow:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc-14]
        build_type: [Release]
        multithreaded: [ON, OFF]
        asan: [OFF]
        ubsan: [OFF]
      fail-fast: false

    env:
      MAKEFLAGS: "-j2"
      OMP_NUM_THREADS: 2
      CTEST_PARALLEL_LEVEL: 1

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Setup Cpp (C++ / C)
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.compiler }}
          cmake: true

      - name: Install dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libboost1.74-all-dev
          libsuitesparse-dev
          libeigen3-dev
          libscotch-dev
          libmetis-dev
          libhdf5-dev
          libomp-dev
          petsc-dev
          mpich
          lcov

      - name: Configure CMake
        run: >
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DRODIN_USE_MPI=ON
          -DRODIN_USE_PETSC=ON
          -DRODIN_USE_ASAN=${{ matrix.asan }}
          -DRODIN_USE_UBSAN=${{ matrix.ubsan }}
          -DRODIN_BUILD_DOC=OFF
          -DRODIN_INSTALL_RESOURCES=OFF
          -DRODIN_USE_MCSS=OFF
          -DRODIN_BUILD_EXAMPLES=OFF
          -DRODIN_BUILD_BENCHMARKS=OFF
          -DRODIN_BUILD_SRC=ON
          -DRODIN_BUILD_UNIT_TESTS=ON
          -DRODIN_BUILD_MANUFACTURED_TESTS=ON
          -DRODIN_CODE_COVERAGE=OFF
          -DRODIN_MULTITHREADED=${{ matrix.multithreaded }}

      - name: Build
        run: cmake --build ${{ github.workspace }}/build

      - name: Run slow manufactured tests
        run: >
          ctest --test-dir ${{ github.workspace }}/build/tests
          -L slow
          --output-on-failure
          -j ${{ env.CTEST_PARALLEL_LEVEL }}

      - name: Rerun failed slow manufactured tests (verbose)
        if: failure()
        run: >
          ctest --test-dir ${{ github.workspace }}/build/tests
          -L slow
          --rerun-failed -V --output-on-failure

  Coverage:
    runs-on: ubuntu-latest
    needs: [Unit, Manufactured, Slow]
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-14]
        build_type: [Release]
        multithreaded: [ON, OFF]
        asan: [OFF]
        ubsan: [OFF]

    env:
      MAKEFLAGS: "-j2"
      OMP_NUM_THREADS: 2
      CTEST_PARALLEL_LEVEL: 2
      GCOV: gcov-14

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - name: Hydrate test resources
        run: >-
          git lfs pull
          --include="resources/medit/Square.medit.mesh,resources/mfem/Square.mfem.mesh,resources/mfem/SquareWithHole.mfem.mesh,resources/mfem/StarSquare.mfem.mesh,resources/examples/ShapeOptimization/LevelSetCantilever2D.mfem.mesh,resources/tests/mfem/h1/**"

      - name: Setup Cpp (C++ / C)
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.compiler }}
          cmake: true

      - name: Install dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          gcc-14 g++-14
          libboost1.74-all-dev
          libsuitesparse-dev
          libeigen3-dev
          libscotch-dev
          libmetis-dev
          libhdf5-dev
          libomp-dev
          petsc-dev
          mpich
          lcov

      - name: Configure CMake (coverage)
        run: >
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DRODIN_USE_MPI=ON
          -DRODIN_USE_PETSC=ON
          -DRODIN_USE_ASAN=${{ matrix.asan }}
          -DRODIN_USE_UBSAN=${{ matrix.ubsan }}
          -DRODIN_BUILD_DOC=OFF
          -DRODIN_INSTALL_RESOURCES=OFF
          -DRODIN_USE_MCSS=OFF
          -DRODIN_BUILD_EXAMPLES=OFF
          -DRODIN_BUILD_BENCHMARKS=OFF
          -DRODIN_BUILD_SRC=ON
          -DRODIN_BUILD_UNIT_TESTS=ON
          -DRODIN_BUILD_MANUFACTURED_TESTS=ON
          -DRODIN_LCOV_FLAGS="--ignore-errors gcov,gcov --ignore-errors mismatch --ignore-errors unused"
          -DRODIN_CODE_COVERAGE=ON
          -DRODIN_MULTITHREADED=${{ matrix.multithreaded }}

      - name: Build
        run: cmake --build ${{ github.workspace }}/build

      - name: Run unit tests (coverage build)
        run: >
          ctest --test-dir ${{ github.workspace }}/build/tests
          -L unit -LE distributed
          --output-on-failure
          -j ${{ env.CTEST_PARALLEL_LEVEL }}

      - name: Run distributed tests (coverage build)
        run: >
          ctest --test-dir ${{ github.workspace }}/build/tests
          -L distributed -LE slow
          --output-on-failure
          -j 1

      - name: Run manufactured tests (coverage build)
        run: >
          ctest --test-dir ${{ github.workspace }}/build/tests
          -L manufactured -LE "slow|distributed"
          --output-on-failure
          -j 1

      - name: Make coverage
        run: cmake --build ${{ github.workspace }}/build --target RodinCoverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ${{ github.workspace }}/build/RodinCoverage.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.build_type }},mt-${{ matrix.multithreaded }}
          name: cov-${{ matrix.build_type }}-mt${{ matrix.multithreaded }}
          root_dir: ${{ github.workspace }}
          use_pypi: true
          verbose: true
          fail_ci_if_error: true
