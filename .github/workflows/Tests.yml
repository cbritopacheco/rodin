# Tests are grouped by registration directory; runtime variants remain matrix axes.
name: Tests
'on':
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
permissions:
  contents: read
concurrency:
  group: Tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  Plan:
    name: CMake / CI
    runs-on: ubuntu-latest
    outputs:
      unit_1: ${{ steps.plan.outputs.unit_1 }}
      unit_2: ${{ steps.plan.outputs.unit_2 }}
      unit_3: ${{ steps.plan.outputs.unit_3 }}
      manufactured_1: ${{ steps.plan.outputs.manufactured_1 }}
      manufactured_2: ${{ steps.plan.outputs.manufactured_2 }}
      slow: ${{ steps.plan.outputs.slow }}
      baseline: ${{ steps.plan.outputs.baseline }}
      native_convergence: ${{ steps.plan.outputs.native_convergence }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install CI planning dependency
        run: python3 -m pip install PyYAML==6.0.2
      - name: Verify scoped discovery and incremental coverage guards
        run: python3 -m unittest discover -s dev -p 'test_ci_*.py' -v
      - name: Plan current source groups
        id: plan
        run: python3 dev/ci_test_plan.py
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ci-test-plan
          path: |
            ci-test-plan.json
            ci-convergence-plan.json
            ci-coverage-targets.json
          if-no-files-found: error
  Unit1:
    name: ${{ matrix.name }}
    needs:
      - Plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.unit_1) }}
    uses: ./.github/workflows/TestGroup.yml
    with:
      backend: ${{ matrix.backend }}
      profile: ${{ matrix.profile }}
      group: ${{ matrix.group }}
      build_type: ${{ matrix.build_type }}
      multithreaded: ${{ matrix.multithreaded }}
      asan: ${{ matrix.asan }}
      ubsan: ${{ matrix.ubsan }}
      id: ${{ matrix.id }}
      name: ${{ matrix.name }}
      baseline: ${{ matrix.baseline }}
    secrets: inherit
  Unit2:
    name: ${{ matrix.name }}
    needs:
      - Plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.unit_2) }}
    uses: ./.github/workflows/TestGroup.yml
    with:
      backend: ${{ matrix.backend }}
      profile: ${{ matrix.profile }}
      group: ${{ matrix.group }}
      build_type: ${{ matrix.build_type }}
      multithreaded: ${{ matrix.multithreaded }}
      asan: ${{ matrix.asan }}
      ubsan: ${{ matrix.ubsan }}
      id: ${{ matrix.id }}
      name: ${{ matrix.name }}
      baseline: ${{ matrix.baseline }}
    secrets: inherit
  Unit3:
    name: ${{ matrix.name }}
    needs:
      - Plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.unit_3) }}
    uses: ./.github/workflows/TestGroup.yml
    with:
      backend: ${{ matrix.backend }}
      profile: ${{ matrix.profile }}
      group: ${{ matrix.group }}
      build_type: ${{ matrix.build_type }}
      multithreaded: ${{ matrix.multithreaded }}
      asan: ${{ matrix.asan }}
      ubsan: ${{ matrix.ubsan }}
      id: ${{ matrix.id }}
      name: ${{ matrix.name }}
      baseline: ${{ matrix.baseline }}
    secrets: inherit
  Manufactured1:
    name: ${{ matrix.name }}
    needs:
      - Plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.manufactured_1) }}
    uses: ./.github/workflows/TestGroup.yml
    with:
      backend: ${{ matrix.backend }}
      profile: ${{ matrix.profile }}
      group: ${{ matrix.group }}
      build_type: ${{ matrix.build_type }}
      multithreaded: ${{ matrix.multithreaded }}
      asan: ${{ matrix.asan }}
      ubsan: ${{ matrix.ubsan }}
      id: ${{ matrix.id }}
      name: ${{ matrix.name }}
      baseline: ${{ matrix.baseline }}
    secrets: inherit
  Manufactured2:
    name: ${{ matrix.name }}
    needs:
      - Plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.manufactured_2) }}
    uses: ./.github/workflows/TestGroup.yml
    with:
      backend: ${{ matrix.backend }}
      profile: ${{ matrix.profile }}
      group: ${{ matrix.group }}
      build_type: ${{ matrix.build_type }}
      multithreaded: ${{ matrix.multithreaded }}
      asan: ${{ matrix.asan }}
      ubsan: ${{ matrix.ubsan }}
      id: ${{ matrix.id }}
      name: ${{ matrix.name }}
      baseline: ${{ matrix.baseline }}
    secrets: inherit
  Slow:
    name: ${{ matrix.name }}
    needs:
      - Plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.slow) }}
    uses: ./.github/workflows/TestGroup.yml
    with:
      backend: ${{ matrix.backend }}
      profile: ${{ matrix.profile }}
      group: ${{ matrix.group }}
      build_type: ${{ matrix.build_type }}
      multithreaded: ${{ matrix.multithreaded }}
      asan: ${{ matrix.asan }}
      ubsan: ${{ matrix.ubsan }}
      id: ${{ matrix.id }}
      name: ${{ matrix.name }}
      baseline: ${{ matrix.baseline }}
    secrets: inherit
  Baseline:
    name: ${{ matrix.name }}
    needs:
      - Plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.baseline) }}
    uses: ./.github/workflows/TestGroup.yml
    with:
      backend: ${{ matrix.backend }}
      profile: ${{ matrix.profile }}
      group: ${{ matrix.group }}
      build_type: ${{ matrix.build_type }}
      multithreaded: ${{ matrix.multithreaded }}
      asan: ${{ matrix.asan }}
      ubsan: ${{ matrix.ubsan }}
      id: ${{ matrix.id }}
      name: ${{ matrix.name }}
      baseline: ${{ matrix.baseline }}
    secrets: inherit
  Convergence:
    needs:
      - Plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (matrix.suite == 'curved_nonlinear_pyramid' || matrix.suite == 'pressure_pyramid' || (matrix.group == 'convergence/hp/NonlinearPoisson' || matrix.group == 'convergence/p/NonlinearPoisson')) && 360 || matrix.suite == 'baseline' && 90 || 180 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - multithreaded: 'ON'
            suite: pressure_light
            path: Convergence / h / Stokes / Stability
            group: ''
          - multithreaded: 'ON'
            suite: pressure_tetrahedron
            path: Convergence / h / Stokes / Stability
            group: ''
          - multithreaded: 'ON'
            suite: pressure_pyramid
            path: Convergence / h / Stokes / Stability
            group: ''
          - multithreaded: 'ON'
            suite: curved_projection
            path: Convergence / Isoparametric / Projection
            group: ''
          - multithreaded: 'ON'
            suite: curved_diffusion_light
            path: Convergence / Isoparametric / Diffusion
            group: ''
          - multithreaded: 'ON'
            suite: curved_diffusion_tetrahedron
            path: Convergence / Isoparametric / Diffusion
            group: ''
          - multithreaded: 'ON'
            suite: curved_diffusion_pyramid
            path: Convergence / Isoparametric / Diffusion
            group: ''
          - multithreaded: 'ON'
            suite: curved_reaction_light
            path: Convergence / Isoparametric / ReactionDiffusion
            group: ''
          - multithreaded: 'ON'
            suite: curved_reaction_tetrahedron
            path: Convergence / Isoparametric / ReactionDiffusion
            group: ''
          - multithreaded: 'ON'
            suite: curved_reaction_pyramid
            path: Convergence / Isoparametric / ReactionDiffusion
            group: ''
          - multithreaded: 'ON'
            suite: curved_nonlinear_light
            path: Convergence / Isoparametric / NonlinearPoisson
            group: ''
          - multithreaded: 'ON'
            suite: curved_nonlinear_tetrahedron
            path: Convergence / Isoparametric / NonlinearPoisson
            group: ''
          - multithreaded: 'ON'
            suite: curved_nonlinear_pyramid
            path: Convergence / Isoparametric / NonlinearPoisson
            group: ''
          - multithreaded: 'ON'
            suite: curved_elasticity
            path: Convergence / Isoparametric / LinearElasticity
            group: ''
          - multithreaded: 'ON'
            suite: curved_stokes
            path: Convergence / Isoparametric / Stokes
            group: ''
          - multithreaded: 'ON'
            suite: curved_helmholtz
            path: Convergence / Isoparametric / Helmholtz
            group: ''
          - multithreaded: 'OFF'
            suite: pressure_light
            path: Convergence / h / Stokes / Stability
            group: ''
          - multithreaded: 'OFF'
            suite: pressure_tetrahedron
            path: Convergence / h / Stokes / Stability
            group: ''
          - multithreaded: 'OFF'
            suite: pressure_pyramid
            path: Convergence / h / Stokes / Stability
            group: ''
          - multithreaded: 'OFF'
            suite: curved_projection
            path: Convergence / Isoparametric / Projection
            group: ''
          - multithreaded: 'OFF'
            suite: curved_diffusion_light
            path: Convergence / Isoparametric / Diffusion
            group: ''
          - multithreaded: 'OFF'
            suite: curved_diffusion_tetrahedron
            path: Convergence / Isoparametric / Diffusion
            group: ''
          - multithreaded: 'OFF'
            suite: curved_diffusion_pyramid
            path: Convergence / Isoparametric / Diffusion
            group: ''
          - multithreaded: 'OFF'
            suite: curved_reaction_light
            path: Convergence / Isoparametric / ReactionDiffusion
            group: ''
          - multithreaded: 'OFF'
            suite: curved_reaction_tetrahedron
            path: Convergence / Isoparametric / ReactionDiffusion
            group: ''
          - multithreaded: 'OFF'
            suite: curved_reaction_pyramid
            path: Convergence / Isoparametric / ReactionDiffusion
            group: ''
          - multithreaded: 'OFF'
            suite: curved_nonlinear_light
            path: Convergence / Isoparametric / NonlinearPoisson
            group: ''
          - multithreaded: 'OFF'
            suite: curved_nonlinear_tetrahedron
            path: Convergence / Isoparametric / NonlinearPoisson
            group: ''
          - multithreaded: 'OFF'
            suite: curved_nonlinear_pyramid
            path: Convergence / Isoparametric / NonlinearPoisson
            group: ''
          - multithreaded: 'OFF'
            suite: curved_elasticity
            path: Convergence / Isoparametric / LinearElasticity
            group: ''
          - multithreaded: 'OFF'
            suite: curved_stokes
            path: Convergence / Isoparametric / Stokes
            group: ''
          - multithreaded: 'OFF'
            suite: curved_helmholtz
            path: Convergence / Isoparametric / Helmholtz
            group: ''
    env:
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
      RODIN_PROFILE_STABILITY: ${{ startsWith(matrix.suite, 'pressure_') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: gcc-14
          cmake: true
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y lcov libboost1.74-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev libmetis-dev libhdf5-dev
          libomp-dev
      - name: Configure convergence build
        run: cmake -S . -B build -DRODIN_CODE_COVERAGE=ON -DRODIN_LCOV_FLAGS="--ignore-errors gcov,gcov --ignore-errors mismatch --ignore-errors unused" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRODIN_BUILD_SRC=ON -DRODIN_BUILD_UNIT_TESTS=OFF -DRODIN_BUILD_MANUFACTURED_TESTS=OFF
          -DRODIN_BUILD_CONVERGENCE_TESTS=ON -DRODIN_BUILD_EXAMPLES=OFF -DRODIN_BUILD_BENCHMARKS=OFF -DRODIN_INSTALL_RESOURCES=OFF -DRODIN_USE_MPI=OFF
          -DRODIN_USE_PETSC=OFF -DRODIN_MULTITHREADED=${{ matrix.multithreaded }}
      - name: Build convergence suites
        run: |
          case "${{ matrix.suite }}" in
            baseline) python3 dev/ci_tests.py build --group "$CONVERGENCE_GROUP" --profile convergence-baseline ;;
            pressure_*)
              cmake --build build -j 2 --target RodinConvergenceHStokesStability ;;
            curved_projection)
              cmake --build build -j 2 --target \
                RodinConvergenceIsoparametricP0Projection \
                RodinConvergenceIsoparametricGeometryApproximation ;;
            curved_diffusion_*)
              cmake --build build -j 2 --target RodinConvergenceIsoparametricDiffusion ;;
            curved_reaction_*)
              cmake --build build -j 2 --target RodinConvergenceIsoparametricReactionDiffusion ;;
            curved_nonlinear_*)
              cmake --build build -j 2 --target RodinConvergenceIsoparametricNonlinearPoisson ;;
            curved_elasticity)
              cmake --build build -j 2 --target RodinConvergenceIsoparametricLinearElasticity ;;
            curved_stokes)
              cmake --build build -j 2 --target RodinConvergenceIsoparametricStokes ;;
            curved_helmholtz)
              cmake --build build -j 2 --target RodinConvergenceIsoparametricHelmholtz ;;
            *) exit 1 ;;
          esac
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
          CONVERGENCE_GROUP: ${{ matrix.group }}
      - name: Run convergence suites
        run: |
          curved_pattern='^RodinConvergenceIsoparametric(P0Projection|GeometryApproximation|.*Diffusion|NonlinearPoisson|LinearElasticity|Stokes|Helmholtz)_'
          case "${{ matrix.suite }}" in
            baseline)
              python3 dev/ci_tests.py run --group "$CONVERGENCE_GROUP" --profile convergence-baseline ;;
            pressure_light) pressure_exclude='_(Tetrahedron|Pyramid)$' ;;
            pressure_tetrahedron) pressure_exclude='_(Triangle|Quadrilateral|Pyramid|Hexahedron|Wedge|Utility|Workspace)$' ;;
            pressure_pyramid) pressure_exclude='_(Triangle|Quadrilateral|Tetrahedron|Hexahedron|Wedge|Utility|Workspace)$' ;;
            curved_projection) suite_pattern='(P0Projection|GeometryApproximation)' ;;
            curved_diffusion_*) suite_pattern='(Approximated|Lifted|SmoothLifted)?Diffusion' ;;
            curved_reaction_*) suite_pattern='ReactionDiffusion' ;;
            curved_nonlinear_*) suite_pattern='NonlinearPoisson' ;;
            curved_elasticity) suite_pattern='LinearElasticity' ;;
            curved_stokes) suite_pattern='Stokes' ;;
            curved_helmholtz) suite_pattern='Helmholtz' ;;
            *) exit 1 ;;
          esac
          if [[ "${{ matrix.suite }}" == pressure_* ]]; then
            ctest --test-dir build/tests -L convergence \
              -R '^RodinConvergenceHStokesStability_' -E "$pressure_exclude" \
              --output-on-failure --no-tests=error -j 1
          elif [[ "${{ matrix.suite }}" == curved_diffusion_* || \
                  "${{ matrix.suite }}" == curved_reaction_* || \
                  "${{ matrix.suite }}" == curved_nonlinear_* ]]; then
            case "${{ matrix.suite }}" in
              *_light) geometry_exclude='_(Tetrahedron|Pyramid)$' ;;
              *_tetrahedron) geometry_exclude='_(Segment|Triangle|Quadrilateral|Pyramid|Hexahedron|Wedge)$' ;;
              *_pyramid) geometry_exclude='_(Segment|Triangle|Quadrilateral|Tetrahedron|Hexahedron|Wedge)$' ;;
              *) exit 1 ;;
            esac
            ctest --test-dir build/tests -L convergence \
              -R "^RodinConvergenceIsoparametric${suite_pattern}_" -E "$geometry_exclude" \
              --output-on-failure --no-tests=error -j 1
          elif [ "${{ matrix.suite }}" != baseline ]; then
            ctest --test-dir build/tests -L convergence \
              -R "^RodinConvergenceIsoparametric${suite_pattern}_" \
              --output-on-failure --no-tests=error -j 1
          fi
        env:
          CONVERGENCE_GROUP: ${{ matrix.group }}
      - name: Publish independent production coverage
        id: coverage_record
        uses: ./.github/actions/coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          definition: '{"job":"${{ github.job }}","matrix":${{ toJSON(matrix) }}}'
          artifact_name: ci-target-${{ github.job }}-${{ strategy.job-index }}

    name: ${{ matrix.path }} (MT=${{ matrix.multithreaded }}, suite=${{ matrix.suite }})
  ConvergenceBaseline:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (matrix.suite == 'curved_nonlinear_pyramid' || matrix.suite == 'pressure_pyramid' || (matrix.group == 'convergence/hp/NonlinearPoisson' || matrix.group == 'convergence/p/NonlinearPoisson')) && 360 || matrix.suite == 'baseline' && 90 || 180 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.native_convergence) }}
    env:
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
      RODIN_PROFILE_STABILITY: ${{ startsWith(matrix.suite, 'pressure_') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: gcc-14
          cmake: true
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y lcov libboost1.74-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev libmetis-dev libhdf5-dev
          libomp-dev
      - name: Configure convergence build
        run: cmake -S . -B build -DRODIN_CODE_COVERAGE=ON -DRODIN_LCOV_FLAGS="--ignore-errors gcov,gcov --ignore-errors mismatch --ignore-errors unused" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRODIN_BUILD_SRC=ON -DRODIN_BUILD_UNIT_TESTS=OFF -DRODIN_BUILD_MANUFACTURED_TESTS=OFF
          -DRODIN_BUILD_CONVERGENCE_TESTS=ON -DRODIN_BUILD_EXAMPLES=OFF -DRODIN_BUILD_BENCHMARKS=OFF -DRODIN_INSTALL_RESOURCES=OFF -DRODIN_USE_MPI=OFF
          -DRODIN_USE_PETSC=OFF -DRODIN_MULTITHREADED=${{ matrix.multithreaded }}
      - name: Build convergence suites
        run: |
          case "${{ matrix.suite }}" in
            baseline) python3 dev/ci_tests.py build --group "$CONVERGENCE_GROUP" --profile convergence-baseline ;;
            pressure_*)
              cmake --build build -j 2 --target RodinConvergenceHStokesStability ;;
            curved_projection)
              cmake --build build -j 2 --target \
                RodinConvergenceIsoparametricP0Projection \
                RodinConvergenceIsoparametricGeometryApproximation ;;
            curved_diffusion_*)
              cmake --build build -j 2 --target RodinConvergenceIsoparametricDiffusion ;;
            curved_reaction_*)
              cmake --build build -j 2 --target RodinConvergenceIsoparametricReactionDiffusion ;;
            curved_nonlinear_*)
              cmake --build build -j 2 --target RodinConvergenceIsoparametricNonlinearPoisson ;;
            curved_elasticity)
              cmake --build build -j 2 --target RodinConvergenceIsoparametricLinearElasticity ;;
            curved_stokes)
              cmake --build build -j 2 --target RodinConvergenceIsoparametricStokes ;;
            curved_helmholtz)
              cmake --build build -j 2 --target RodinConvergenceIsoparametricHelmholtz ;;
            *) exit 1 ;;
          esac
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
          CONVERGENCE_GROUP: ${{ matrix.group }}
      - name: Run convergence suites
        run: |
          curved_pattern='^RodinConvergenceIsoparametric(P0Projection|GeometryApproximation|.*Diffusion|NonlinearPoisson|LinearElasticity|Stokes|Helmholtz)_'
          case "${{ matrix.suite }}" in
            baseline)
              python3 dev/ci_tests.py run --group "$CONVERGENCE_GROUP" --profile convergence-baseline ;;
            pressure_light) pressure_exclude='_(Tetrahedron|Pyramid)$' ;;
            pressure_tetrahedron) pressure_exclude='_(Triangle|Quadrilateral|Pyramid|Hexahedron|Wedge|Utility|Workspace)$' ;;
            pressure_pyramid) pressure_exclude='_(Triangle|Quadrilateral|Tetrahedron|Hexahedron|Wedge|Utility|Workspace)$' ;;
            curved_projection) suite_pattern='(P0Projection|GeometryApproximation)' ;;
            curved_diffusion_*) suite_pattern='(Approximated|Lifted|SmoothLifted)?Diffusion' ;;
            curved_reaction_*) suite_pattern='ReactionDiffusion' ;;
            curved_nonlinear_*) suite_pattern='NonlinearPoisson' ;;
            curved_elasticity) suite_pattern='LinearElasticity' ;;
            curved_stokes) suite_pattern='Stokes' ;;
            curved_helmholtz) suite_pattern='Helmholtz' ;;
            *) exit 1 ;;
          esac
          if [[ "${{ matrix.suite }}" == pressure_* ]]; then
            ctest --test-dir build/tests -L convergence \
              -R '^RodinConvergenceHStokesStability_' -E "$pressure_exclude" \
              --output-on-failure --no-tests=error -j 1
          elif [[ "${{ matrix.suite }}" == curved_diffusion_* || \
                  "${{ matrix.suite }}" == curved_reaction_* || \
                  "${{ matrix.suite }}" == curved_nonlinear_* ]]; then
            case "${{ matrix.suite }}" in
              *_light) geometry_exclude='_(Tetrahedron|Pyramid)$' ;;
              *_tetrahedron) geometry_exclude='_(Segment|Triangle|Quadrilateral|Pyramid|Hexahedron|Wedge)$' ;;
              *_pyramid) geometry_exclude='_(Segment|Triangle|Quadrilateral|Tetrahedron|Hexahedron|Wedge)$' ;;
              *) exit 1 ;;
            esac
            ctest --test-dir build/tests -L convergence \
              -R "^RodinConvergenceIsoparametric${suite_pattern}_" -E "$geometry_exclude" \
              --output-on-failure --no-tests=error -j 1
          elif [ "${{ matrix.suite }}" != baseline ]; then
            ctest --test-dir build/tests -L convergence \
              -R "^RodinConvergenceIsoparametric${suite_pattern}_" \
              --output-on-failure --no-tests=error -j 1
          fi
        env:
          CONVERGENCE_GROUP: ${{ matrix.group }}
      - name: Publish independent production coverage
        id: coverage_record
        uses: ./.github/actions/coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          definition: '{"job":"${{ github.job }}","matrix":${{ toJSON(matrix) }}}'
          artifact_name: ci-target-${{ github.job }}-${{ strategy.job-index }}

    name: ${{ matrix.path }} (MT=${{ matrix.multithreaded }}, suite=${{ matrix.suite }})
    needs:
      - Plan
  MPIH1Restriction:
    needs:
      - Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - multithreaded: 'ON'
            np: '1'
            partition: standard
            geometry: '(Segment|Triangle|Quadrilateral|Tetrahedron|Hexahedron|Wedge)'
            path: Unit / Rodin / MPI / Variational / H1Restriction / Slow
          - multithreaded: 'ON'
            np: '1'
            partition: pyramid
            geometry: 'Pyramid'
            path: Unit / Rodin / MPI / Variational / H1Restriction / Slow
          - multithreaded: 'ON'
            np: '2'
            partition: standard
            geometry: '(Segment|Triangle|Quadrilateral|Tetrahedron|Hexahedron|Wedge)'
            path: Unit / Rodin / MPI / Variational / H1Restriction / Slow
          - multithreaded: 'ON'
            np: '2'
            partition: pyramid
            geometry: 'Pyramid'
            path: Unit / Rodin / MPI / Variational / H1Restriction / Slow
          - multithreaded: 'ON'
            np: '3'
            partition: standard
            geometry: '(Segment|Triangle|Quadrilateral|Tetrahedron|Hexahedron|Wedge)'
            path: Unit / Rodin / MPI / Variational / H1Restriction / Slow
          - multithreaded: 'ON'
            np: '3'
            partition: pyramid
            geometry: 'Pyramid'
            path: Unit / Rodin / MPI / Variational / H1Restriction / Slow
          - multithreaded: 'ON'
            np: '4'
            partition: standard
            geometry: '(Segment|Triangle|Quadrilateral|Tetrahedron|Hexahedron|Wedge)'
            path: Unit / Rodin / MPI / Variational / H1Restriction / Slow
          - multithreaded: 'ON'
            np: '4'
            partition: pyramid
            geometry: 'Pyramid'
            path: Unit / Rodin / MPI / Variational / H1Restriction / Slow
          - multithreaded: 'ON'
            np: '8'
            partition: standard
            geometry: '(Segment|Triangle|Quadrilateral|Tetrahedron|Hexahedron|Wedge)'
            path: Unit / Rodin / MPI / Variational / H1Restriction / Slow
          - multithreaded: 'ON'
            np: '8'
            partition: pyramid
            geometry: 'Pyramid'
            path: Unit / Rodin / MPI / Variational / H1Restriction / Slow
          - multithreaded: 'OFF'
            np: '1'
            partition: standard
            geometry: '(Segment|Triangle|Quadrilateral|Tetrahedron|Hexahedron|Wedge)'
            path: Unit / Rodin / MPI / Variational / H1Restriction / Slow
          - multithreaded: 'OFF'
            np: '1'
            partition: pyramid
            geometry: 'Pyramid'
            path: Unit / Rodin / MPI / Variational / H1Restriction / Slow
          - multithreaded: 'OFF'
            np: '2'
            partition: standard
            geometry: '(Segment|Triangle|Quadrilateral|Tetrahedron|Hexahedron|Wedge)'
            path: Unit / Rodin / MPI / Variational / H1Restriction / Slow
          - multithreaded: 'OFF'
            np: '2'
            partition: pyramid
            geometry: 'Pyramid'
            path: Unit / Rodin / MPI / Variational / H1Restriction / Slow
          - multithreaded: 'OFF'
            np: '3'
            partition: standard
            geometry: '(Segment|Triangle|Quadrilateral|Tetrahedron|Hexahedron|Wedge)'
            path: Unit / Rodin / MPI / Variational / H1Restriction / Slow
          - multithreaded: 'OFF'
