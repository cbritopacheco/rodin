# Shared builds and independent hierarchical test groups; numerical lane sources live in .github/ci/.
name: Tests
'on':
  push:
    branches:
    - master
    - develop
  pull_request:
    branches:
    - master
    - develop
permissions:
  contents: read
  actions: read
concurrency:
  group: Tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  Plan:
    name: CMake / CI
    runs-on: ubuntu-latest
    outputs:
      configurations: ${{ steps.common.outputs.configurations }}
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: false
    - name: Install CI planning dependency
      run: python3 -m pip install PyYAML==6.0.2
    - name: Verify generated hierarchical dependency graph
      run: python3 dev/ci_schedule.py
    - name: Verify scoped discovery and incremental coverage guards
      run: python3 -m unittest discover -s dev -p 'test_ci_*.py' -v
    - name: Plan current source groups
      id: plan
      run: python3 dev/ci_test_plan.py
    - name: Plan common compilation configurations
      id: common
      run: python3 dev/ci_build_graph.py prepare
    - uses: actions/upload-artifact@v4
      with:
        overwrite: true
        name: ci-test-plan
        path: 'ci-test-plan.json

          ci-build-plan.json

          ci-convergence-plan.json

          ci-coverage-targets.json

          ci-common-plan.json

          '
        if-no-files-found: error
  Configurations:
    name: ${{ matrix.definition.mode }} / ${{ matrix.definition.cmake.CMAKE_BUILD_TYPE }} / MT-${{ matrix.definition.cmake.RODIN_MULTITHREADED
      }} / ASan-${{ matrix.definition.cmake.RODIN_USE_ASAN }} / UBSan-${{ matrix.definition.cmake.RODIN_USE_UBSAN }}
    needs: Plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.configurations) }}
    uses: ./.github/workflows/TestConfiguration.yml
    with:
      id: ${{ matrix.id }}
      definition: ${{ toJSON(matrix.definition) }}
    secrets: inherit
  InstallationUbuntu:
    needs:
    - Plan
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        compiler:
        - gcc-12
        - gcc-13
        - gcc-14
        mpi:
        - 'ON'
        - 'OFF'
        petsc:
        - 'ON'
        - 'OFF'
      fail-fast: false
    env:
      MAKEFLAGS: -j2
      RODIN_INSTALL_RESOURCES: 'OFF'
    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: false
    - name: Setup Cpp (C++ / C)
      uses: aminya/setup-cpp@v1
      with:
        compiler: ${{ matrix.compiler }}
        cmake: true
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libboost-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev
        libmetis-dev libhdf5-dev libomp-dev petsc-dev mpich lcov
    - name: Run installation test
      run: bash tests/installation/test_installation.sh
      env:
        RODIN_USE_MPI: ${{ matrix.mpi }}
        RODIN_USE_PETSC: ${{ matrix.petsc }}
        RODIN_INSTALL_RESOURCES: ${{ env.RODIN_INSTALL_RESOURCES }}
    - name: Archive installation artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        overwrite: true
        name: installation-test-failure-${{ matrix.compiler }}-mpi${{ matrix.mpi }}-petsc${{ matrix.petsc }}
        path: 'build/install-test/

          build/test-installation-project/

          '
        retention-days: 7
    name: Installation / Ubuntu (OS=${{ matrix.os }}, Compiler=${{ matrix.compiler }}, MPI=${{ matrix.mpi }}, PETSc=${{ matrix.petsc
      }})
  InstallationMacOS:
    needs:
    - Plan
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - macos-latest
        mpi:
        - 'ON'
        - 'OFF'
        petsc:
        - 'ON'
        - 'OFF'
      fail-fast: false
    env:
      MAKEFLAGS: -j2
      RODIN_INSTALL_RESOURCES: 'OFF'
    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: false
    - name: Setup Python
      run: 'brew list -1 | grep python | while read formula; do brew unlink $formula; brew link --overwrite $formula; done
        || true

        '
    - name: Update Homebrew
      run: brew update
    - name: Install dependencies
      run: "BREW_PACKAGES=\"boost boost-mpi eigen libomp\"\nif [ \"${{ matrix.petsc }}\" = \"ON\" ]; then\n  BREW_PACKAGES=\"\
        $BREW_PACKAGES petsc hdf5-mpi\"\nelif [ \"${{ matrix.mpi }}\" = \"ON\" ]; then\n  BREW_PACKAGES=\"$BREW_PACKAGES open-mpi\
        \ hdf5-mpi\"\nelse\n  BREW_PACKAGES=\"$BREW_PACKAGES hdf5\"\nfi\nbrew install $BREW_PACKAGES\n"
    - name: Link libomp
      run: 'brew link --force --overwrite libomp

        '
    - name: Verify dependencies
      run: "echo \"Boost location:\"\nbrew --prefix boost\necho \"Eigen location:\"\nbrew --prefix eigen\necho \"OpenMP location:\"\
        \nbrew --prefix libomp\nif [ \"${{ matrix.petsc }}\" = \"ON\" ]; then\n  echo \"PETSc location:\"\n  brew --prefix\
        \ petsc\nfi\nif [ \"${{ matrix.mpi }}\" = \"ON\" ]; then\n  echo \"MPI location:\"\n  brew --prefix open-mpi 2>/dev/null\
        \ || brew --prefix petsc\nfi\n"
    - name: Run installation test
      run: bash tests/installation/test_installation.sh
      env:
        RODIN_USE_MPI: ${{ matrix.mpi }}
        RODIN_USE_PETSC: ${{ matrix.petsc }}
        RODIN_INSTALL_RESOURCES: ${{ env.RODIN_INSTALL_RESOURCES }}
    - name: Archive installation artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        overwrite: true
        name: installation-test-failure-macos-mpi${{ matrix.mpi }}-petsc${{ matrix.petsc }}
        path: 'build/install-test/

          build/test-installation-project/

          '
        retention-days: 7
    name: Installation / MacOS (OS=${{ matrix.os }}, MPI=${{ matrix.mpi }}, PETSc=${{ matrix.petsc }})
  CoverageFinalize:
    name: Coverage / Finalize
    if: always()
    needs:
    - Plan
    - Configurations
    - InstallationUbuntu
    - InstallationMacOS
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: false
    - name: Download producer records
      uses: actions/download-artifact@v4
      with:
        pattern: ci-result-*
        path: ci-artifacts
    - name: Download targeted coverage
      uses: actions/download-artifact@v4
      with:
        pattern: ci-target-*
        path: ci-artifacts
    - name: Download expected plan
      uses: actions/download-artifact@v4
      with:
        name: ci-test-plan
        path: .
    - name: Download shared-build index
      uses: actions/download-artifact@v4
      with:
        pattern: ci-build-index-*
        path: ci-build-indices
    - name: Download directory build receipts
      uses: actions/download-artifact@v4
      with:
        pattern: ci-built-*
        path: ci-artifacts
    - name: Download successful coverage publications
      uses: actions/download-artifact@v4
      with:
        pattern: ci-publication-*
        path: ci-artifacts
    - name: Verify complete coverage and unchanged compilation inventory
      env:
        CI_JOB_RESULTS: ${{ toJSON(needs.*.result) }}
      run: python3 dev/ci_coverage.py finalize
    - name: Publish complete coverage summary
      uses: actions/upload-artifact@v4
      with:
        overwrite: true
        name: coverage-final-summary
        path: coverage-summary.json
        if-no-files-found: error
    - name: Finalize Codecov status
      uses: codecov/codecov-action@v5
      with:
        run_command: send-notifications
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
        use_pypi: true
    - name: Enforce 95 percent production coverage
      run: python3 dev/ci_coverage.py threshold
