      - PublishPETScCurvedNonlinearTetrahedronConvergence
      - PublishPETScComplexConvergence
      - PublishPETScMatrixRanges
      - Unit1
      - Unit2
      - Unit3
      - Manufactured1
      - Manufactured2
      - Slow
      - Baseline
      - Convergence
      - MPIH1Restriction
      - PETScConvergence
      - PETScDegreeConvergence
      - PETScCurvedConvergence
      - PETScCurvedBoundaryConvergence
      - PETScCurvedNonlinearTetrahedronConvergence
      - PETScComplexConvergence
      - PETScMatrixRanges
      - InstallationUbuntu
      - InstallationMacOS
      - Plan
      - ConvergenceBaseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Download producer records
        uses: actions/download-artifact@v4
        with:
          pattern: ci-result-*
          path: ci-artifacts
      - name: Download targeted coverage
        uses: actions/download-artifact@v4
        with:
          pattern: ci-target-*
          path: ci-artifacts
      - name: Download expected plan
        uses: actions/download-artifact@v4
        with:
          name: ci-test-plan
          path: .
      - name: Download shared-build index
        uses: actions/download-artifact@v4
        with:
          pattern: ci-build-index-*
          path: ci-build-indices
      - name: Download directory build receipts
        uses: actions/download-artifact@v4
        with:
          pattern: ci-built-*
          path: ci-artifacts
      - name: Download successful coverage publications
        uses: actions/download-artifact@v4
        with:
          pattern: ci-publication-*
          path: ci-artifacts
      - name: Verify complete coverage and unchanged compilation inventory
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs.*.result) }}
        run: python3 dev/ci_coverage.py finalize
      - name: Publish complete coverage summary
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: coverage-final-summary
          path: coverage-summary.json
          if-no-files-found: error
      - name: Finalize Codecov status
        uses: codecov/codecov-action@v5
        with:
          run_command: send-notifications
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          use_pypi: true
      - name: Enforce 95 percent production coverage
        run: python3 dev/ci_coverage.py threshold
