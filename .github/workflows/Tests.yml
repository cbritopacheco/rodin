          - multithreaded: 'OFF'
            selection: np3
            partition: remaining
            path: Convergence / Isoparametric / NonlinearPoisson / Tetrahedron
          - multithreaded: 'OFF'
            selection: np4
            partition: MixedNeumannP1Rates
            path: Convergence / Isoparametric / NonlinearPoisson / Tetrahedron
          - multithreaded: 'OFF'
            selection: np4
            partition: RobinP1Rates
            path: Convergence / Isoparametric / NonlinearPoisson / Tetrahedron
          - multithreaded: 'OFF'
            selection: np4
            partition: PureNeumannP1Rates
            path: Convergence / Isoparametric / NonlinearPoisson / Tetrahedron
          - multithreaded: 'OFF'
            selection: np4
            partition: remaining
            path: Convergence / Isoparametric / NonlinearPoisson / Tetrahedron
    env:
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: gcc-14
          cmake: true
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y lcov libboost1.74-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev libmetis-dev libhdf5-dev
          petsc-dev mpich
      - name: Configure curved nonlinear tetrahedral convergence build
        run: cmake -S . -B build -DRODIN_CODE_COVERAGE=ON -DRODIN_LCOV_FLAGS="--ignore-errors gcov,gcov --ignore-errors mismatch --ignore-errors unused" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRODIN_BUILD_SRC=ON -DRODIN_BUILD_UNIT_TESTS=OFF -DRODIN_BUILD_MANUFACTURED_TESTS=OFF
          -DRODIN_BUILD_CONVERGENCE_TESTS=ON -DRODIN_BUILD_EXAMPLES=OFF -DRODIN_BUILD_BENCHMARKS=OFF -DRODIN_INSTALL_RESOURCES=OFF -DRODIN_MULTITHREADED=${{
          matrix.multithreaded }} -DRODIN_USE_MPI=ON -DRODIN_USE_PETSC=ON
      - name: Build curved nonlinear tetrahedral convergence suite
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
        run: cmake --build build -j 2 --target RodinConvergenceIsoparametricPETScNonlinearPoissonBoundary
      - name: Run curved nonlinear tetrahedral convergence partition
        run: |
          case "${{ matrix.selection }}" in
            local) context_pattern='' ;;
            np1|np2|np3|np4) context_pattern='MPI_${{ matrix.selection }}_' ;;
            *) exit 1 ;;
          esac
          prefix="^RodinConvergenceIsoparametricPETScNonlinearPoissonBoundary_${context_pattern}"
          case "${{ matrix.partition }}" in
            MixedNeumannP1Rates|RobinP1Rates|PureNeumannP1Rates)
              ctest --test-dir build/tests \
                -R "${prefix}${{ matrix.partition }}_Tetrahedron$" \
                --output-on-failure --no-tests=error -j 1 ;;
            remaining)
              ctest --test-dir build/tests \
                -R "${prefix}[A-Za-z0-9]+_Tetrahedron$" \
                -E '_(MixedNeumann|Robin|PureNeumann)P1Rates_Tetrahedron$' \
                --output-on-failure --no-tests=error -j 1 ;;
            *) exit 1 ;;
          esac
      - name: Publish independent production coverage
        id: coverage_record
        uses: ./.github/actions/coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          definition: '{"job":"${{ github.job }}","matrix":${{ toJSON(matrix) }}}'
          artifact_name: ci-target-${{ github.job }}-${{ strategy.job-index }}

    name: ${{ matrix.path }} (multithreaded=${{ matrix.multithreaded }}, selection=${{ matrix.selection }}, partition=${{ matrix.partition }})
  PETScComplexConvergence:
    needs:
      - Plan
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.suite == 'curved_boundary' && 240 || startsWith(matrix.suite, 'curved_helmholtz') && 180 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - multithreaded: 'ON'
            suite: bulk
            path: Convergence / h / PETSc / Complex
          - multithreaded: 'ON'
            suite: curved_helmholtz_light
            path: Convergence / Isoparametric / PETSc / Complex
          - multithreaded: 'ON'
            suite: curved_helmholtz_tetrahedron
            path: Convergence / Isoparametric / PETSc / Complex
          - multithreaded: 'ON'
            suite: curved_helmholtz_pyramid
            path: Convergence / Isoparametric / PETSc / Complex
          - multithreaded: 'ON'
            suite: curved_projection
            path: Convergence / Isoparametric / PETSc / Complex
          - multithreaded: 'ON'
            suite: boundary
            path: Convergence / h / PETSc / BoundaryConditions / Complex
          - multithreaded: 'ON'
            suite: curved_boundary
            path: Convergence / Isoparametric / PETSc / BoundaryConditions / Complex
          - multithreaded: 'ON'
            suite: submesh
            path: Unit / Rodin / PETSc / H1Restriction / Slow
          - multithreaded: 'OFF'
            suite: bulk
            path: Convergence / h / PETSc / Complex
          - multithreaded: 'OFF'
            suite: curved_helmholtz_light
            path: Convergence / Isoparametric / PETSc / Complex
          - multithreaded: 'OFF'
            suite: curved_helmholtz_tetrahedron
            path: Convergence / Isoparametric / PETSc / Complex
          - multithreaded: 'OFF'
            suite: curved_helmholtz_pyramid
            path: Convergence / Isoparametric / PETSc / Complex
          - multithreaded: 'OFF'
            suite: curved_projection
            path: Convergence / Isoparametric / PETSc / Complex
          - multithreaded: 'OFF'
            suite: boundary
            path: Convergence / h / PETSc / BoundaryConditions / Complex
          - multithreaded: 'OFF'
            suite: curved_boundary
            path: Convergence / Isoparametric / PETSc / BoundaryConditions / Complex
          - multithreaded: 'OFF'
            suite: submesh
            path: Unit / Rodin / PETSc / H1Restriction / Slow
    env:
      GCOV: gcov-14
      RODIN_COVERAGE: ${{ matrix.suite == 'submesh' && 'ON' || 'OFF' }}
      OMP_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: gcc-14
          cmake: true
      - name: Install complex PETSc dependencies
        run: sudo apt-get update && sudo apt-get install -y lcov libboost1.74-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev libmetis-dev libhdf5-dev
          libomp-dev libpetsc-complex3.19-dev openmpi-bin libopenmpi-dev pkg-config lcov
      - name: Configure complex PETSc convergence build
        run: cmake -S . -B build -DRODIN_CODE_COVERAGE=ON -DRODIN_LCOV_FLAGS="--ignore-errors gcov,gcov --ignore-errors mismatch --ignore-errors unused" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRODIN_BUILD_SRC=ON -DRODIN_BUILD_UNIT_TESTS=ON -DRODIN_BUILD_MANUFACTURED_TESTS=OFF
          -DRODIN_BUILD_CONVERGENCE_TESTS=ON -DRODIN_BUILD_EXAMPLES=OFF -DRODIN_BUILD_BENCHMARKS=OFF -DRODIN_INSTALL_RESOURCES=OFF -DRODIN_MULTITHREADED=${{
          matrix.multithreaded }} -DRODIN_USE_MPI=ON -DRODIN_USE_PETSC=ON -DRODIN_USE_ASAN=OFF -DRODIN_USE_UBSAN=OFF   -DPETSc_DIR="$(pkg-config
          --variable=prefix PETSc)"
      - name: Build complex PETSc convergence suite
        if: matrix.suite == 'bulk'
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
        run: cmake --build build -j 2 --target RodinConvergenceHPETScHelmholtz RodinPETScSNESStateTest RodinConvergencePPETScHelmholtz RodinConvergenceHPPETScHelmholtz
          RodinPETScScalarIntegralTest RodinVariationalIntegralTest
      - name: Run complex PETSc convergence suite
        if: matrix.suite == 'bulk'
        run: ctest --test-dir build/tests -R 'RodinConvergence(H|P|HP)PETSc(MPI)?Helmholtz|RodinPETScSNESStateTest|RodinPETSc(MPI)?ScalarIntegralTest|Rodin_Variational_Integral'
          -E '^RodinConvergenceHPETScHelmholtzBoundary_' --output-on-failure --no-tests=error -j 1
      - name: Build curved complex PETSc Helmholtz suite
        if: startsWith(matrix.suite, 'curved_helmholtz')
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
        run: cmake --build build -j 2 --target RodinConvergenceIsoparametricPETScHelmholtz
      - name: Run curved complex PETSc Helmholtz suite
        if: startsWith(matrix.suite, 'curved_helmholtz')
        run: |
          case "${{ matrix.suite }}" in
            curved_helmholtz_light) geometry_pattern='(Segment|Triangle|Quadrilateral|Hexahedron|Wedge)' ;;
            curved_helmholtz_tetrahedron) geometry_pattern='Tetrahedron' ;;
            curved_helmholtz_pyramid) geometry_pattern='Pyramid' ;;
            *) exit 1 ;;
          esac
          ctest --test-dir build/tests \
            -R "^RodinConvergenceIsoparametricPETSc(MPI)?Helmholtz_.*${geometry_pattern}$" \
            --output-on-failure --no-tests=error -j 1
      - name: Build curved complex PETSc projection suite
        if: matrix.suite == 'curved_projection'
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
        run: cmake --build build -j 2 --target RodinConvergenceIsoparametricPETScP0Projection
      - name: Run curved complex PETSc projection suite
        if: matrix.suite == 'curved_projection'
        run: ctest --test-dir build/tests -R '^RodinConvergenceIsoparametricPETSc(MPI)?P0Projection_' --output-on-failure --no-tests=error -j
          1
      - name: Build complex PETSc Helmholtz boundary suite
        if: matrix.suite == 'boundary'
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
        run: cmake --build build -j 2 --target RodinConvergenceHPETScHelmholtzBoundary
      - name: Run complex PETSc Helmholtz boundary suite
        if: matrix.suite == 'boundary'
        run: ctest --test-dir build/tests -R '^RodinConvergenceHPETScHelmholtzBoundary_' --output-on-failure -j 1
      - name: Build complex PETSc SubMesh restriction matrix
        if: matrix.suite == 'submesh'
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
        run: cmake --build build -j 2 --target RodinPETScMPIH1SubMeshRestrictionTest
      - name: Discover coverage tests without runtime profiles
        if: matrix.suite == 'submesh'
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
        run: |
          mkdir -p coverage-discovery-excluded
          ctest --test-dir build/tests --show-only=json-v1 > coverage-discovery-excluded/tests.json
      - name: Run complex PETSc SubMesh restriction matrix
        if: matrix.suite == 'submesh'
        env:
          OMP_WAIT_POLICY: PASSIVE
          OPENBLAS_NUM_THREADS: 1
          OMPI_MCA_hwloc_base_binding_policy: none
        run: ctest --test-dir build/tests -R '^RodinPETScMPIH1SubMeshRestrictionTest_np(1|2|3|4|8)_(Segment|Triangle|Quadrilateral|Tetrahedron|Pyramid|Hexahedron|Wedge)_(Affine|Curved)_K[1-6]$'
          --output-on-failure --no-tests=error -j 1
      - name: Retain complex H1 restriction diagnostics
        if: always() && matrix.suite == 'submesh'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: petsc-complex-h1-restriction-diagnostics-mt${{ matrix.multithreaded }}
          path: |
            build/tests/Testing/Temporary/LastTest.log
            build/tests/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
      - name: Build curved complex PETSc Helmholtz boundary suite
        if: matrix.suite == 'curved_boundary'
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
        run: cmake --build build -j 2 --target RodinConvergenceIsoparametricPETScHelmholtzBoundary
      - name: Run curved complex PETSc Helmholtz boundary suite
        if: matrix.suite == 'curved_boundary'
        run: ctest --test-dir build/tests -R '^RodinConvergenceIsoparametricPETScHelmholtzBoundary_' --output-on-failure --no-tests=error -j 1
      - name: Publish independent production coverage
        id: coverage_record
        uses: ./.github/actions/coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          definition: '{"job":"${{ github.job }}","matrix":${{ toJSON(matrix) }}}'
          artifact_name: ci-target-${{ github.job }}-${{ strategy.job-index }}

    name: ${{ matrix.path }} (multithreaded=${{ matrix.multithreaded }}, suite=${{ matrix.suite }})
  PETScMatrixRanges:
    needs:
      - Plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - scalar: real
            multithreaded: 'ON'
            path: Unit / Rodin / PETSc / MatrixRanges
          - scalar: real
            multithreaded: 'OFF'
            path: Unit / Rodin / PETSc / MatrixRanges
          - scalar: complex
            multithreaded: 'ON'
            path: Unit / Rodin / PETSc / MatrixRanges
          - scalar: complex
            multithreaded: 'OFF'
            path: Unit / Rodin / PETSc / MatrixRanges
    env:
      GCOV: gcov-14
      OMP_NUM_THREADS: 2
      OMP_WAIT_POLICY: PASSIVE
      OMPI_MCA_hwloc_base_binding_policy: none
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: gcc-14
          cmake: true
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y lcov libboost1.74-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev libmetis-dev libhdf5-dev
          libpetsc-${{ matrix.scalar }}-dev libomp-dev mpi-default-dev lcov
      - name: Configure PETSc matrix-range build
        run: cmake -S . -B build -DRODIN_CODE_COVERAGE=ON -DRODIN_LCOV_FLAGS="--ignore-errors gcov,gcov --ignore-errors mismatch --ignore-errors unused" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRODIN_BUILD_SRC=ON -DRODIN_BUILD_UNIT_TESTS=ON -DRODIN_BUILD_MANUFACTURED_TESTS=OFF
          -DRODIN_BUILD_CONVERGENCE_TESTS=OFF -DRODIN_BUILD_EXAMPLES=OFF -DRODIN_BUILD_BENCHMARKS=OFF -DRODIN_INSTALL_RESOURCES=OFF -DRODIN_MULTITHREADED=${{
          matrix.multithreaded }} -DRODIN_USE_MPI=ON -DRODIN_USE_PETSC=ON -DRODIN_USE_ASAN=OFF -DRODIN_USE_UBSAN=OFF
      - name: Build PETSc matrix-range and I/O tests
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
        run: cmake --build build -j 2 --target RodinMPIMatrixRangeTest RodinPETScGridFunctionTest RodinPETScMPIGridFunctionTest RodinPETScMPIP0P0gTest
          RodinPETScMPISubMeshGridFunctionTest RodinPETScIOHDF5IOTest RodinPETScIOMEDITIOTest RodinPETScIOMFEMIOTest RodinPETScIOMFEMMPIIOTest
          RodinPETScSingleFieldConstraintTest RodinPETScRestrictedNonlocalTest RodinPETScMixedTargetAssemblyTest RodinPETScMPIMixedTargetAssemblyTest
          RodinPETScSingleFieldTargetAssemblyTest RodinPETScSNESStateTest
      - name: Discover coverage tests without runtime profiles
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
        run: |
          mkdir -p coverage-discovery-excluded
          ctest --test-dir build/tests --show-only=json-v1 > coverage-discovery-excluded/tests.json
      - name: Run PETSc matrix-range and I/O tests
        run: ctest --test-dir build/tests -R '^(RodinMPIMatrixRangeTest_np[1-4]|RodinPETScGridFunctionTest|RodinPETScMPIGridFunctionTest_np[1-4]|RodinPETScMPIP0P0gTest_np[1-4]|RodinPETScMPISubMeshGridFunctionTest_np[124]|RodinPETScIO(HDF5IO|MEDITIO|MFEMIO)Test|RodinPETScIOMFEMMPIIOTest_np[12348]|RodinPETScSingleFieldConstraintTest|RodinPETScRestrictedNonlocalTest|RodinPETScMixedTargetAssemblyTest|RodinPETScMPIMixedTargetAssemblyTest_np[12348]|RodinPETScSingleFieldTargetAssemblyTest|RodinPETScSNESStateTest)$'
          --output-on-failure --no-tests=error -j 1
      - name: Publish independent production coverage
        id: coverage_record
        uses: ./.github/actions/coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          definition: '{"job":"${{ github.job }}","matrix":${{ toJSON(matrix) }}}'
          artifact_name: ci-target-${{ github.job }}-${{ strategy.job-index }}

    name: ${{ matrix.path }} (scalar=${{ matrix.scalar }}, multithreaded=${{ matrix.multithreaded }})
  InstallationUbuntu:
    needs:
      - Plan
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
        compiler:
          - gcc-12
          - gcc-13
          - gcc-14
        mpi:
          - 'ON'
          - 'OFF'
        petsc:
          - 'ON'
          - 'OFF'
      fail-fast: false
    env:
      MAKEFLAGS: -j2
      RODIN_INSTALL_RESOURCES: 'OFF'
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - name: Setup Cpp (C++ / C)
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.compiler }}
          cmake: true
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev libmetis-dev libhdf5-dev
          libomp-dev petsc-dev mpich lcov
      - name: Run installation test
        run: bash tests/installation/test_installation.sh
        env:
          RODIN_USE_MPI: ${{ matrix.mpi }}
          RODIN_USE_PETSC: ${{ matrix.petsc }}
          RODIN_INSTALL_RESOURCES: ${{ env.RODIN_INSTALL_RESOURCES }}
      - name: Archive installation artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: installation-test-failure-${{ matrix.compiler }}-mpi${{ matrix.mpi }}-petsc${{ matrix.petsc }}
          path: |
            build/install-test/
            build/test-installation-project/
          retention-days: 7
    name: Installation / Ubuntu (os=${{ matrix.os }}, compiler=${{ matrix.compiler }}, mpi=${{ matrix.mpi }}, petsc=${{ matrix.petsc }})
  InstallationMacOS:
    needs:
      - Plan
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
        mpi:
          - 'ON'
          - 'OFF'
        petsc:
          - 'ON'
          - 'OFF'
      fail-fast: false
    env:
      MAKEFLAGS: -j2
      RODIN_INSTALL_RESOURCES: 'OFF'
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - name: Setup Python
        run: |
          brew list -1 | grep python | while read formula; do brew unlink $formula; brew link --overwrite $formula; done || true
      - name: Update Homebrew
        run: brew update
      - name: Install dependencies
        run: |
          BREW_PACKAGES="boost boost-mpi eigen libomp"
          if [ "${{ matrix.petsc }}" = "ON" ]; then
            BREW_PACKAGES="$BREW_PACKAGES petsc hdf5-mpi"
          elif [ "${{ matrix.mpi }}" = "ON" ]; then
            BREW_PACKAGES="$BREW_PACKAGES open-mpi hdf5-mpi"
          else
            BREW_PACKAGES="$BREW_PACKAGES hdf5"
          fi
          brew install $BREW_PACKAGES
      - name: Link libomp
        run: |
          brew link --force --overwrite libomp
      - name: Verify dependencies
        run: |
          echo "Boost location:"
          brew --prefix boost
          echo "Eigen location:"
          brew --prefix eigen
          echo "OpenMP location:"
          brew --prefix libomp
          if [ "${{ matrix.petsc }}" = "ON" ]; then
            echo "PETSc location:"
            brew --prefix petsc
          fi
          if [ "${{ matrix.mpi }}" = "ON" ]; then
            echo "MPI location:"
            brew --prefix open-mpi 2>/dev/null || brew --prefix petsc
          fi
      - name: Run installation test
        run: bash tests/installation/test_installation.sh
        env:
          RODIN_USE_MPI: ${{ matrix.mpi }}
          RODIN_USE_PETSC: ${{ matrix.petsc }}
          RODIN_INSTALL_RESOURCES: ${{ env.RODIN_INSTALL_RESOURCES }}
      - name: Archive installation artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: installation-test-failure-macos-mpi${{ matrix.mpi }}-petsc${{ matrix.petsc }}
          path: |
            build/install-test/
            build/test-installation-project/
          retention-days: 7
    name: Installation / MacOS (os=${{ matrix.os }}, mpi=${{ matrix.mpi }}, petsc=${{ matrix.petsc }})
  CoverageFinalize:
    name: Coverage / Finalize
    if: always()
    needs:
      - Unit1
      - Unit2
      - Unit3
      - Manufactured1
      - Manufactured2
      - Slow
      - Baseline
      - Convergence
      - MPIH1Restriction
      - PETScConvergence
      - PETScDegreeConvergence
      - PETScCurvedConvergence
      - PETScCurvedBoundaryConvergence
      - PETScCurvedNonlinearTetrahedronConvergence
      - PETScComplexConvergence
      - PETScMatrixRanges
      - InstallationUbuntu
      - InstallationMacOS
      - Plan
      - ConvergenceBaseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Download producer records
        uses: actions/download-artifact@v4
        with:
          pattern: ci-result-*
          path: ci-artifacts
      - name: Download targeted coverage
        uses: actions/download-artifact@v4
        with:
          pattern: ci-target-*
          path: ci-artifacts
      - name: Download expected plan
        uses: actions/download-artifact@v4
        with:
          name: ci-test-plan
          path: .
      - name: Verify complete coverage and unchanged compilation inventory
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 dev/ci_coverage.py finalize
      - name: Publish complete coverage summary
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: coverage-final-summary
          path: coverage-summary.json
          if-no-files-found: error
      - name: Finalize Codecov status
        uses: codecov/codecov-action@v5
        with:
          run_command: send-notifications
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          use_pypi: true
      - name: Enforce 95 percent production coverage
        run: python3 dev/ci_coverage.py threshold
