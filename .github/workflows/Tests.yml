# Tests are grouped by registration directory; runtime variants remain matrix axes.
name: Tests
'on':
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
permissions:
  contents: read
  actions: read
concurrency:
  group: Tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  Plan:
    name: CMake / CI
    runs-on: ubuntu-latest
    outputs:
      unit_1: ${{ steps.plan.outputs.unit_1 }}
      unit_2: ${{ steps.plan.outputs.unit_2 }}
      unit_3: ${{ steps.plan.outputs.unit_3 }}
      manufactured_1: ${{ steps.plan.outputs.manufactured_1 }}
      manufactured_2: ${{ steps.plan.outputs.manufactured_2 }}
      slow: ${{ steps.plan.outputs.slow }}
      baseline: ${{ steps.plan.outputs.baseline }}
      native_convergence: ${{ steps.plan.outputs.native_convergence }}
      common_optional: ${{ steps.common.outputs.common_optional }}
      common_default: ${{ steps.common.outputs.common_default }}
      common_baseline: ${{ steps.common.outputs.common_baseline }}
      common_native: ${{ steps.common.outputs.common_native }}
      common_mpi: ${{ steps.common.outputs.common_mpi }}
      common_petsc: ${{ steps.common.outputs.common_petsc }}
      common_complex: ${{ steps.common.outputs.common_complex }}
      common_ranges_real: ${{ steps.common.outputs.common_ranges_real }}
      common_ranges_complex: ${{ steps.common.outputs.common_ranges_complex }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install CI planning dependency
        run: python3 -m pip install PyYAML==6.0.2
      - name: Verify scoped discovery and incremental coverage guards
        run: python3 -m unittest discover -s dev -p 'test_ci_*.py' -v
      - name: Plan current source groups
        id: plan
        run: python3 dev/ci_test_plan.py
      - name: Plan common compilation configurations
        id: common
        run: python3 dev/ci_build_graph.py prepare
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ci-test-plan
          path: |
            ci-test-plan.json
            ci-build-plan.json
            ci-convergence-plan.json
            ci-coverage-targets.json
            ci-common-plan.json
          if-no-files-found: error
  CommonOptional:
    name: Build / Common / Optional
    needs: Plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.common_optional) }}
    uses: ./.github/workflows/TestCommon.yml
    with:
      definition: ${{ toJSON(matrix.definition) }}
      id: ${{ matrix.id }}
  BuildPlanOptional:
    name: Build / Plan / Optional
    needs: [Plan, CommonOptional]
    uses: ./.github/workflows/TestBuildPlan.yml
    with:
      mode: optional
  DirectoryOptional1:
    name: Build / ${{ matrix.name }}
    needs: BuildPlanOptional
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.BuildPlanOptional.outputs.directory_1) }}
    uses: ./.github/workflows/TestDirectoryBuild.yml
    with:
      id: ${{ matrix.id }}
      runner: ${{ matrix.runner }}
      mode: ${{ matrix.mode }}
  DirectoryOptional2:
    name: Build / ${{ matrix.name }}
    needs: BuildPlanOptional
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.BuildPlanOptional.outputs.directory_2) }}
    uses: ./.github/workflows/TestDirectoryBuild.yml
    with:
      id: ${{ matrix.id }}
      runner: ${{ matrix.runner }}
      mode: ${{ matrix.mode }}
  DirectoryOptional3:
    name: Build / ${{ matrix.name }}
    needs: BuildPlanOptional
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.BuildPlanOptional.outputs.directory_3) }}
    uses: ./.github/workflows/TestDirectoryBuild.yml
    with:
      id: ${{ matrix.id }}
      runner: ${{ matrix.runner }}
      mode: ${{ matrix.mode }}
  DirectoryOptional4:
    name: Build / ${{ matrix.name }}
    needs: BuildPlanOptional
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.BuildPlanOptional.outputs.directory_4) }}
    uses: ./.github/workflows/TestDirectoryBuild.yml
    with:
      id: ${{ matrix.id }}
      runner: ${{ matrix.runner }}
      mode: ${{ matrix.mode }}
  CommonDefault:
    name: Build / Common / Default
    needs: Plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.common_default) }}
    uses: ./.github/workflows/TestCommon.yml
    with:
      definition: ${{ toJSON(matrix.definition) }}
      id: ${{ matrix.id }}
  BuildPlanDefault:
    name: Build / Plan / Default
    needs: [Plan, CommonDefault]
    uses: ./.github/workflows/TestBuildPlan.yml
    with:
      mode: default
  DirectoryDefault1:
    name: Build / ${{ matrix.name }}
    needs: BuildPlanDefault
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.BuildPlanDefault.outputs.directory_1) }}
    uses: ./.github/workflows/TestDirectoryBuild.yml
    with:
      id: ${{ matrix.id }}
      runner: ${{ matrix.runner }}
      mode: ${{ matrix.mode }}
  DirectoryDefault2:
    name: Build / ${{ matrix.name }}
    needs: BuildPlanDefault
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.BuildPlanDefault.outputs.directory_2) }}
    uses: ./.github/workflows/TestDirectoryBuild.yml
    with:
      id: ${{ matrix.id }}
      runner: ${{ matrix.runner }}
      mode: ${{ matrix.mode }}
  CommonBaseline:
    name: Build / Common / Baseline
    needs: Plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.common_baseline) }}
    uses: ./.github/workflows/TestCommon.yml
    with:
      definition: ${{ toJSON(matrix.definition) }}
      id: ${{ matrix.id }}
  BuildPlanBaseline:
    name: Build / Plan / Baseline
    needs: [Plan, CommonBaseline]
    uses: ./.github/workflows/TestBuildPlan.yml
    with:
      mode: baseline
  DirectoryBaseline1:
    name: Build / ${{ matrix.name }}
    needs: BuildPlanBaseline
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.BuildPlanBaseline.outputs.directory_1) }}
    uses: ./.github/workflows/TestDirectoryBuild.yml
    with:
      id: ${{ matrix.id }}
      runner: ${{ matrix.runner }}
      mode: ${{ matrix.mode }}
  DirectoryBaseline2:
    name: Build / ${{ matrix.name }}
    needs: BuildPlanBaseline
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.BuildPlanBaseline.outputs.directory_2) }}
    uses: ./.github/workflows/TestDirectoryBuild.yml
    with:
      id: ${{ matrix.id }}
      runner: ${{ matrix.runner }}
      mode: ${{ matrix.mode }}
  CommonNative:
    name: Build / Common / Native
    needs: Plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.common_native) }}
    uses: ./.github/workflows/TestCommon.yml
    with:
      definition: ${{ toJSON(matrix.definition) }}
      id: ${{ matrix.id }}
  BuildPlanNative:
    name: Build / Plan / Native
    needs: [Plan, CommonNative]
    uses: ./.github/workflows/TestBuildPlan.yml
    with:
      mode: native
  DirectoryNative1:
    name: Build / ${{ matrix.name }}
    needs: BuildPlanNative
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.BuildPlanNative.outputs.directory_1) }}
    uses: ./.github/workflows/TestDirectoryBuild.yml
    with:
      id: ${{ matrix.id }}
      runner: ${{ matrix.runner }}
      mode: ${{ matrix.mode }}
  DirectoryNative2:
    name: Build / ${{ matrix.name }}
    needs: BuildPlanNative
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.BuildPlanNative.outputs.directory_2) }}
    uses: ./.github/workflows/TestDirectoryBuild.yml
    with:
      id: ${{ matrix.id }}
      runner: ${{ matrix.runner }}
      mode: ${{ matrix.mode }}
  CommonMPI:
    name: Build / Common / MPI
    needs: Plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.common_mpi) }}
    uses: ./.github/workflows/TestCommon.yml
    with:
      definition: ${{ toJSON(matrix.definition) }}
      id: ${{ matrix.id }}
  BuildPlanMPI:
    name: Build / Plan / MPI
    needs: [Plan, CommonMPI]
    uses: ./.github/workflows/TestBuildPlan.yml
    with:
      mode: mpi
  DirectoryMPI1:
    name: Build / ${{ matrix.name }}
    needs: BuildPlanMPI
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.BuildPlanMPI.outputs.directory_1) }}
    uses: ./.github/workflows/TestDirectoryBuild.yml
    with:
      id: ${{ matrix.id }}
      runner: ${{ matrix.runner }}
      mode: ${{ matrix.mode }}
  DirectoryMPI2:
    name: Build / ${{ matrix.name }}
    needs: BuildPlanMPI
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.BuildPlanMPI.outputs.directory_2) }}
    uses: ./.github/workflows/TestDirectoryBuild.yml
    with:
      id: ${{ matrix.id }}
      runner: ${{ matrix.runner }}
      mode: ${{ matrix.mode }}
  CommonPETSc:
    name: Build / Common / PETSc
    needs: Plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.common_petsc) }}
    uses: ./.github/workflows/TestCommon.yml
    with:
      definition: ${{ toJSON(matrix.definition) }}
      id: ${{ matrix.id }}
  BuildPlanPETSc:
    name: Build / Plan / PETSc
    needs: [Plan, CommonPETSc]
    uses: ./.github/workflows/TestBuildPlan.yml
    with:
      mode: petsc
  DirectoryPETSc1:
    name: Build / ${{ matrix.name }}
    needs: BuildPlanPETSc
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.BuildPlanPETSc.outputs.directory_1) }}
    uses: ./.github/workflows/TestDirectoryBuild.yml
    with:
      id: ${{ matrix.id }}
      runner: ${{ matrix.runner }}
      mode: ${{ matrix.mode }}
  DirectoryPETSc2:
    name: Build / ${{ matrix.name }}
    needs: BuildPlanPETSc
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.BuildPlanPETSc.outputs.directory_2) }}
    uses: ./.github/workflows/TestDirectoryBuild.yml
    with:
      id: ${{ matrix.id }}
      runner: ${{ matrix.runner }}
      mode: ${{ matrix.mode }}
  CommonComplex:
    name: Build / Common / Complex
    needs: Plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.common_complex) }}
    uses: ./.github/workflows/TestCommon.yml
    with:
      definition: ${{ toJSON(matrix.definition) }}
      id: ${{ matrix.id }}
  BuildPlanComplex:
    name: Build / Plan / Complex
    needs: [Plan, CommonComplex]
    uses: ./.github/workflows/TestBuildPlan.yml
    with:
      mode: complex
  DirectoryComplex1:
    name: Build / ${{ matrix.name }}
    needs: BuildPlanComplex
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.BuildPlanComplex.outputs.directory_1) }}
    uses: ./.github/workflows/TestDirectoryBuild.yml
    with:
      id: ${{ matrix.id }}
      runner: ${{ matrix.runner }}
      mode: ${{ matrix.mode }}
  DirectoryComplex2:
    name: Build / ${{ matrix.name }}
    needs: BuildPlanComplex
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.BuildPlanComplex.outputs.directory_2) }}
    uses: ./.github/workflows/TestDirectoryBuild.yml
    with:
      id: ${{ matrix.id }}
      runner: ${{ matrix.runner }}
      mode: ${{ matrix.mode }}
  CommonMatrixRangesReal:
    name: Build / Common / PETSc / MatrixRanges / Real
    needs: Plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.common_ranges_real) }}
    uses: ./.github/workflows/TestCommon.yml
    with:
      definition: ${{ toJSON(matrix.definition) }}
      id: ${{ matrix.id }}
  BuildPlanMatrixRangesReal:
    name: Build / Plan / PETSc / MatrixRanges / Real
    needs: [Plan, CommonMatrixRangesReal]
    uses: ./.github/workflows/TestBuildPlan.yml
    with:
      mode: ranges_real
  DirectoryMatrixRangesReal1:
    name: Build / ${{ matrix.name }}
    needs: BuildPlanMatrixRangesReal
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.BuildPlanMatrixRangesReal.outputs.directory_1) }}
    uses: ./.github/workflows/TestDirectoryBuild.yml
    with:
      id: ${{ matrix.id }}
      runner: ${{ matrix.runner }}
      mode: ${{ matrix.mode }}
  DirectoryMatrixRangesReal2:
    name: Build / ${{ matrix.name }}
    needs: BuildPlanMatrixRangesReal
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.BuildPlanMatrixRangesReal.outputs.directory_2) }}
    uses: ./.github/workflows/TestDirectoryBuild.yml
    with:
      id: ${{ matrix.id }}
      runner: ${{ matrix.runner }}
      mode: ${{ matrix.mode }}
  CommonMatrixRangesComplex:
    name: Build / Common / PETSc / MatrixRanges / Complex
    needs: Plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.common_ranges_complex) }}
    uses: ./.github/workflows/TestCommon.yml
    with:
      definition: ${{ toJSON(matrix.definition) }}
      id: ${{ matrix.id }}
  BuildPlanMatrixRangesComplex:
    name: Build / Plan / PETSc / MatrixRanges / Complex
    needs: [Plan, CommonMatrixRangesComplex]
    uses: ./.github/workflows/TestBuildPlan.yml
    with:
      mode: ranges_complex
  DirectoryMatrixRangesComplex1:
    name: Build / ${{ matrix.name }}
    needs: BuildPlanMatrixRangesComplex
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.BuildPlanMatrixRangesComplex.outputs.directory_1) }}
    uses: ./.github/workflows/TestDirectoryBuild.yml
    with:
      id: ${{ matrix.id }}
      runner: ${{ matrix.runner }}
      mode: ${{ matrix.mode }}
  DirectoryMatrixRangesComplex2:
    name: Build / ${{ matrix.name }}
    needs: BuildPlanMatrixRangesComplex
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.BuildPlanMatrixRangesComplex.outputs.directory_2) }}
    uses: ./.github/workflows/TestDirectoryBuild.yml
    with:
      id: ${{ matrix.id }}
      runner: ${{ matrix.runner }}
      mode: ${{ matrix.mode }}
  Unit1:
    name: ${{ matrix.name }}
    needs:
      - Plan
      - DirectoryOptional1
      - DirectoryOptional2
      - DirectoryOptional3
      - DirectoryOptional4
      - DirectoryBaseline1
      - DirectoryBaseline2
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.unit_1) }}
    uses: ./.github/workflows/TestGroup.yml
    with:
      family: unit_1
      backend: ${{ matrix.backend }}
      profile: ${{ matrix.profile }}
      group: ${{ matrix.group }}
      build_type: ${{ matrix.build_type }}
      multithreaded: ${{ matrix.multithreaded }}
      asan: ${{ matrix.asan }}
      ubsan: ${{ matrix.ubsan }}
      id: ${{ matrix.id }}
      name: ${{ matrix.name }}
      baseline: ${{ matrix.baseline }}
    secrets: inherit
  Unit2:
    name: ${{ matrix.name }}
    needs:
      - Plan
      - DirectoryOptional1
      - DirectoryOptional2
      - DirectoryOptional3
      - DirectoryOptional4
      - DirectoryBaseline1
      - DirectoryBaseline2
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.unit_2) }}
    uses: ./.github/workflows/TestGroup.yml
    with:
      family: unit_2
      backend: ${{ matrix.backend }}
      profile: ${{ matrix.profile }}
      group: ${{ matrix.group }}
      build_type: ${{ matrix.build_type }}
      multithreaded: ${{ matrix.multithreaded }}
      asan: ${{ matrix.asan }}
      ubsan: ${{ matrix.ubsan }}
      id: ${{ matrix.id }}
      name: ${{ matrix.name }}
      baseline: ${{ matrix.baseline }}
    secrets: inherit
  Unit3:
    name: ${{ matrix.name }}
    needs:
      - Plan
      - DirectoryOptional1
      - DirectoryOptional2
      - DirectoryOptional3
      - DirectoryOptional4
      - DirectoryBaseline1
      - DirectoryBaseline2
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.unit_3) }}
    uses: ./.github/workflows/TestGroup.yml
    with:
      family: unit_3
      backend: ${{ matrix.backend }}
      profile: ${{ matrix.profile }}
      group: ${{ matrix.group }}
      build_type: ${{ matrix.build_type }}
      multithreaded: ${{ matrix.multithreaded }}
      asan: ${{ matrix.asan }}
      ubsan: ${{ matrix.ubsan }}
      id: ${{ matrix.id }}
      name: ${{ matrix.name }}
      baseline: ${{ matrix.baseline }}
    secrets: inherit
  Manufactured1:
    name: ${{ matrix.name }}
    needs:
      - Plan
      - DirectoryDefault1
      - DirectoryDefault2
      - DirectoryBaseline1
      - DirectoryBaseline2
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.manufactured_1) }}
    uses: ./.github/workflows/TestGroup.yml
    with:
      family: manufactured_1
      backend: ${{ matrix.backend }}
      profile: ${{ matrix.profile }}
      group: ${{ matrix.group }}
      build_type: ${{ matrix.build_type }}
      multithreaded: ${{ matrix.multithreaded }}
      asan: ${{ matrix.asan }}
      ubsan: ${{ matrix.ubsan }}
      id: ${{ matrix.id }}
      name: ${{ matrix.name }}
      baseline: ${{ matrix.baseline }}
    secrets: inherit
  Manufactured2:
    name: ${{ matrix.name }}
    needs:
      - Plan
      - DirectoryDefault1
      - DirectoryDefault2
      - DirectoryBaseline1
      - DirectoryBaseline2
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.manufactured_2) }}
    uses: ./.github/workflows/TestGroup.yml
    with:
      family: manufactured_2
      backend: ${{ matrix.backend }}
      profile: ${{ matrix.profile }}
      group: ${{ matrix.group }}
      build_type: ${{ matrix.build_type }}
      multithreaded: ${{ matrix.multithreaded }}
      asan: ${{ matrix.asan }}
      ubsan: ${{ matrix.ubsan }}
      id: ${{ matrix.id }}
      name: ${{ matrix.name }}
      baseline: ${{ matrix.baseline }}
    secrets: inherit
  Slow:
    name: ${{ matrix.name }}
    needs:
      - Plan
      - DirectoryBaseline1
      - DirectoryBaseline2
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.slow) }}
    uses: ./.github/workflows/TestGroup.yml
    with:
      family: slow
      backend: ${{ matrix.backend }}
      profile: ${{ matrix.profile }}
      group: ${{ matrix.group }}
      build_type: ${{ matrix.build_type }}
      multithreaded: ${{ matrix.multithreaded }}
      asan: ${{ matrix.asan }}
      ubsan: ${{ matrix.ubsan }}
      id: ${{ matrix.id }}
      name: ${{ matrix.name }}
      baseline: ${{ matrix.baseline }}
    secrets: inherit
  Baseline:
    name: ${{ matrix.name }}
    needs:
      - Plan
      - DirectoryOptional1
      - DirectoryOptional2
      - DirectoryOptional3
      - DirectoryOptional4
      - DirectoryDefault1
      - DirectoryDefault2
      - DirectoryBaseline1
      - DirectoryBaseline2
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.baseline) }}
    uses: ./.github/workflows/TestGroup.yml
    with:
      family: baseline
      backend: ${{ matrix.backend }}
      profile: ${{ matrix.profile }}
      group: ${{ matrix.group }}
      build_type: ${{ matrix.build_type }}
      multithreaded: ${{ matrix.multithreaded }}
      asan: ${{ matrix.asan }}
      ubsan: ${{ matrix.ubsan }}
      id: ${{ matrix.id }}
      name: ${{ matrix.name }}
      baseline: ${{ matrix.baseline }}
    secrets: inherit
  Convergence:
    needs:
      - Plan
      - DirectoryNative1
      - DirectoryNative2
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (matrix.suite == 'curved_nonlinear_pyramid' || matrix.suite == 'pressure_pyramid' || endsWith(matrix.group, '/NonlinearPoisson')) && 360 || matrix.suite == 'baseline' && 90 || 180 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {multithreaded: 'ON', suite: pressure_light, path: Convergence / H / Stokes / Stability, group: ''}
          - {multithreaded: 'ON', suite: pressure_tetrahedron, path: Convergence / H / Stokes / Stability, group: ''}
          - {multithreaded: 'ON', suite: pressure_pyramid, path: Convergence / H / Stokes / Stability, group: ''}
          - {multithreaded: 'ON', suite: curved_projection, path: Convergence / Isoparametric / Projection, group: ''}
          - {multithreaded: 'ON', suite: curved_diffusion_light, path: Convergence / Isoparametric / Diffusion, group: ''}
          - {multithreaded: 'ON', suite: curved_diffusion_tetrahedron, path: Convergence / Isoparametric / Diffusion, group: ''}
          - {multithreaded: 'ON', suite: curved_diffusion_pyramid, path: Convergence / Isoparametric / Diffusion, group: ''}
          - {multithreaded: 'ON', suite: curved_reaction_light, path: Convergence / Isoparametric / ReactionDiffusion, group: ''}
          - {multithreaded: 'ON', suite: curved_reaction_tetrahedron, path: Convergence / Isoparametric / ReactionDiffusion, group: ''}
          - {multithreaded: 'ON', suite: curved_reaction_pyramid, path: Convergence / Isoparametric / ReactionDiffusion, group: ''}
          - {multithreaded: 'ON', suite: curved_nonlinear_light, path: Convergence / Isoparametric / NonlinearPoisson, group: ''}
          - {multithreaded: 'ON', suite: curved_nonlinear_tetrahedron, path: Convergence / Isoparametric / NonlinearPoisson, group: ''}
          - {multithreaded: 'ON', suite: curved_nonlinear_pyramid, path: Convergence / Isoparametric / NonlinearPoisson, group: ''}
          - {multithreaded: 'ON', suite: curved_elasticity_light, path: Convergence / Isoparametric / LinearElasticity, group: ''}
          - {multithreaded: 'ON', suite: curved_elasticity_tetrahedron, path: Convergence / Isoparametric / LinearElasticity, group: ''}
          - {multithreaded: 'ON', suite: curved_elasticity_pyramid, path: Convergence / Isoparametric / LinearElasticity, group: ''}
          - {multithreaded: 'ON', suite: curved_stokes, path: Convergence / Isoparametric / Stokes, group: ''}
          - {multithreaded: 'ON', suite: curved_helmholtz, path: Convergence / Isoparametric / Helmholtz, group: ''}
          - {multithreaded: 'OFF', suite: pressure_light, path: Convergence / H / Stokes / Stability, group: ''}
          - {multithreaded: 'OFF', suite: pressure_tetrahedron, path: Convergence / H / Stokes / Stability, group: ''}
          - {multithreaded: 'OFF', suite: pressure_pyramid, path: Convergence / H / Stokes / Stability, group: ''}
          - {multithreaded: 'OFF', suite: curved_projection, path: Convergence / Isoparametric / Projection, group: ''}
          - {multithreaded: 'OFF', suite: curved_diffusion_light, path: Convergence / Isoparametric / Diffusion, group: ''}
          - {multithreaded: 'OFF', suite: curved_diffusion_tetrahedron, path: Convergence / Isoparametric / Diffusion, group: ''}
          - {multithreaded: 'OFF', suite: curved_diffusion_pyramid, path: Convergence / Isoparametric / Diffusion, group: ''}
          - {multithreaded: 'OFF', suite: curved_reaction_light, path: Convergence / Isoparametric / ReactionDiffusion, group: ''}
          - {multithreaded: 'OFF', suite: curved_reaction_tetrahedron, path: Convergence / Isoparametric / ReactionDiffusion, group: ''}
          - {multithreaded: 'OFF', suite: curved_reaction_pyramid, path: Convergence / Isoparametric / ReactionDiffusion, group: ''}
          - {multithreaded: 'OFF', suite: curved_nonlinear_light, path: Convergence / Isoparametric / NonlinearPoisson, group: ''}
          - {multithreaded: 'OFF', suite: curved_nonlinear_tetrahedron, path: Convergence / Isoparametric / NonlinearPoisson, group: ''}
          - {multithreaded: 'OFF', suite: curved_nonlinear_pyramid, path: Convergence / Isoparametric / NonlinearPoisson, group: ''}
          - {multithreaded: 'OFF', suite: curved_elasticity_light, path: Convergence / Isoparametric / LinearElasticity, group: ''}
          - {multithreaded: 'OFF', suite: curved_elasticity_tetrahedron, path: Convergence / Isoparametric / LinearElasticity, group: ''}
          - {multithreaded: 'OFF', suite: curved_elasticity_pyramid, path: Convergence / Isoparametric / LinearElasticity, group: ''}
          - {multithreaded: 'OFF', suite: curved_stokes, path: Convergence / Isoparametric / Stokes, group: ''}
          - {multithreaded: 'OFF', suite: curved_helmholtz, path: Convergence / Isoparametric / Helmholtz, group: ''}
    env:
      OMP_NUM_THREADS: 2
      OMP_WAIT_POLICY: PASSIVE
      OPENBLAS_NUM_THREADS: 1
      RODIN_PROFILE_STABILITY: ${{ startsWith(matrix.suite, 'pressure_') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: gcc-14
          cmake: true
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y lcov libboost1.74-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev libmetis-dev libhdf5-dev
          libomp-dev
      - name: Restore shared test build
        uses: ./.github/actions/test-build
        with:
          job: Convergence
          matrix: ${{ toJSON(matrix) }}
      - name: Run convergence suites
        run: |
          curved_pattern='^RodinConvergenceIsoparametric(P0Projection|GeometryApproximation|.*Diffusion|NonlinearPoisson|LinearElasticity|Stokes|Helmholtz)_'
          case "${{ matrix.suite }}" in
            baseline)
              python3 dev/ci_tests.py run --group "$CONVERGENCE_GROUP" --profile convergence-baseline ;;
            pressure_light) pressure_exclude='_(Tetrahedron|Pyramid)$' ;;
            pressure_tetrahedron) pressure_exclude='_(Triangle|Quadrilateral|Pyramid|Hexahedron|Wedge|Utility|Workspace)$' ;;
            pressure_pyramid) pressure_exclude='_(Triangle|Quadrilateral|Tetrahedron|Hexahedron|Wedge|Utility|Workspace)$' ;;
            curved_projection) suite_pattern='(P0Projection|GeometryApproximation)' ;;
            curved_diffusion_*) suite_pattern='(Approximated|Lifted|SmoothLifted)?Diffusion' ;;
            curved_reaction_*) suite_pattern='ReactionDiffusion' ;;
            curved_nonlinear_*) suite_pattern='NonlinearPoisson' ;;
            curved_elasticity_*) suite_pattern='LinearElasticity' ;;
            curved_stokes) suite_pattern='Stokes' ;;
            curved_helmholtz) suite_pattern='Helmholtz' ;;
            *) exit 1 ;;
          esac
          if [[ "${{ matrix.suite }}" == pressure_* ]]; then
            ctest --test-dir build/tests -L convergence \
              -R '^RodinConvergenceHStokesStability_' -E "$pressure_exclude" \
              --output-on-failure --no-tests=error -j 1
          elif [[ "${{ matrix.suite }}" == curved_diffusion_* || \
                  "${{ matrix.suite }}" == curved_reaction_* || \
                  "${{ matrix.suite }}" == curved_nonlinear_* || \
                  "${{ matrix.suite }}" == curved_elasticity_* ]]; then
            case "${{ matrix.suite }}" in
              *_light) geometry_exclude='_(Tetrahedron|Pyramid)$' ;;
              *_tetrahedron) geometry_exclude='_(Segment|Triangle|Quadrilateral|Pyramid|Hexahedron|Wedge)$' ;;
              *_pyramid) geometry_exclude='_(Segment|Triangle|Quadrilateral|Tetrahedron|Hexahedron|Wedge)$' ;;
              *) exit 1 ;;
            esac
            ctest --test-dir build/tests -L convergence \
              -R "^RodinConvergenceIsoparametric${suite_pattern}_" -E "$geometry_exclude" \
              --output-on-failure --no-tests=error -j 1
          elif [ "${{ matrix.suite }}" != baseline ]; then
            ctest --test-dir build/tests -L convergence \
              -R "^RodinConvergenceIsoparametric${suite_pattern}_" \
              --output-on-failure --no-tests=error -j 1
          fi
        env:
          CONVERGENCE_GROUP: ${{ matrix.group }}
      - name: Publish independent production coverage
        id: coverage_record
        uses: ./.github/actions/coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          definition: '{"job":"${{ github.job }}","matrix":${{ toJSON(matrix) }}}'
          artifact_name: ci-target-${{ github.job }}-${{ strategy.job-index }}

    name: ${{ matrix.path }} (MT=${{ matrix.multithreaded }}, Suite=${{ matrix.suite }})
  ConvergenceBaseline:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (matrix.suite == 'curved_nonlinear_pyramid' || matrix.suite == 'pressure_pyramid' || endsWith(matrix.group, '/NonlinearPoisson')) && 360 || matrix.suite == 'baseline' && 90 || 180 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Plan.outputs.native_convergence) }}
    env:
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
      RODIN_PROFILE_STABILITY: ${{ startsWith(matrix.suite, 'pressure_') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: gcc-14
          cmake: true
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y lcov libboost1.74-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev libmetis-dev libhdf5-dev
          libomp-dev
      - uses: ./.github/actions/test-build
        with:
          job: ConvergenceBaseline
          matrix: ${{ toJSON(matrix) }}
      - name: Run convergence suites
        run: |
          curved_pattern='^RodinConvergenceIsoparametric(P0Projection|GeometryApproximation|.*Diffusion|NonlinearPoisson|LinearElasticity|Stokes|Helmholtz)_'
          case "${{ matrix.suite }}" in
            baseline)
              python3 dev/ci_tests.py run --group "$CONVERGENCE_GROUP" --profile convergence-baseline ;;
            pressure_light) pressure_exclude='_(Tetrahedron|Pyramid)$' ;;
            pressure_tetrahedron) pressure_exclude='_(Triangle|Quadrilateral|Pyramid|Hexahedron|Wedge|Utility|Workspace)$' ;;
            pressure_pyramid) pressure_exclude='_(Triangle|Quadrilateral|Tetrahedron|Hexahedron|Wedge|Utility|Workspace)$' ;;
            curved_projection) suite_pattern='(P0Projection|GeometryApproximation)' ;;
            curved_diffusion_*) suite_pattern='(Approximated|Lifted|SmoothLifted)?Diffusion' ;;
            curved_reaction_*) suite_pattern='ReactionDiffusion' ;;
            curved_nonlinear_*) suite_pattern='NonlinearPoisson' ;;
            curved_elasticity) suite_pattern='LinearElasticity' ;;
            curved_stokes) suite_pattern='Stokes' ;;
            curved_helmholtz) suite_pattern='Helmholtz' ;;
            *) exit 1 ;;
          esac
          if [[ "${{ matrix.suite }}" == pressure_* ]]; then
            ctest --test-dir build/tests -L convergence \
              -R '^RodinConvergenceHStokesStability_' -E "$pressure_exclude" \
              --output-on-failure --no-tests=error -j 1
          elif [[ "${{ matrix.suite }}" == curved_diffusion_* || \
                  "${{ matrix.suite }}" == curved_reaction_* || \
                  "${{ matrix.suite }}" == curved_nonlinear_* ]]; then
            case "${{ matrix.suite }}" in
              *_light) geometry_exclude='_(Tetrahedron|Pyramid)$' ;;
              *_tetrahedron) geometry_exclude='_(Segment|Triangle|Quadrilateral|Pyramid|Hexahedron|Wedge)$' ;;
              *_pyramid) geometry_exclude='_(Segment|Triangle|Quadrilateral|Tetrahedron|Hexahedron|Wedge)$' ;;
              *) exit 1 ;;
            esac
            ctest --test-dir build/tests -L convergence \
              -R "^RodinConvergenceIsoparametric${suite_pattern}_" -E "$geometry_exclude" \
              --output-on-failure --no-tests=error -j 1
          elif [ "${{ matrix.suite }}" != baseline ]; then
            ctest --test-dir build/tests -L convergence \
              -R "^RodinConvergenceIsoparametric${suite_pattern}_" \
              --output-on-failure --no-tests=error -j 1
          fi
        env:
          CONVERGENCE_GROUP: ${{ matrix.group }}
      - name: Publish independent production coverage
        id: coverage_record
        uses: ./.github/actions/coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          definition: '{"job":"${{ github.job }}","matrix":${{ toJSON(matrix) }}}'
          artifact_name: ci-target-${{ github.job }}-${{ strategy.job-index }}

    name: ${{ matrix.path }} (MT=${{ matrix.multithreaded }}, Suite=${{ matrix.suite }})
    needs:
