      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
      RODIN_PROFILE_STABILITY: ${{ startsWith(matrix.suite, 'pressure_') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: gcc-14
          cmake: true
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y lcov libboost1.74-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev libmetis-dev libhdf5-dev
          petsc-dev mpich
      - name: Configure PETSc convergence build
        run: cmake -S . -B build -DRODIN_CODE_COVERAGE=ON -DRODIN_LCOV_FLAGS="--ignore-errors gcov,gcov --ignore-errors mismatch --ignore-errors unused" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRODIN_BUILD_SRC=ON -DRODIN_BUILD_UNIT_TESTS=OFF -DRODIN_BUILD_MANUFACTURED_TESTS=OFF
          -DRODIN_BUILD_CONVERGENCE_TESTS=ON -DRODIN_BUILD_EXAMPLES=OFF -DRODIN_BUILD_BENCHMARKS=OFF -DRODIN_INSTALL_RESOURCES=OFF -DRODIN_MULTITHREADED=${{
          matrix.multithreaded }} -DRODIN_USE_MPI=ON -DRODIN_USE_PETSC=ON
      - name: Build PETSc convergence suite
        if: matrix.suite == 'bulk'
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
        run: cmake --build build -j 2 --target RodinConvergenceHPETScPoisson RodinConvergenceHPETScMPIPoisson RodinConvergenceHPETScConductivity
          RodinConvergenceHPETScLinearElasticity RodinConvergenceHPETScReactionDiffusion RodinConvergenceHPETScNonlinearPoisson RodinConvergenceHPETScStokes
      - name: Run PETSc convergence suite
        if: matrix.suite == 'bulk'
        run: ctest --test-dir build/tests -R '^RodinConvergenceHPETSc' -E '^RodinConvergenceHPETSc(Poisson|Conductivity|LinearElasticity|Stokes|ReactionDiffusion|NonlinearPoisson)Boundary_|^RodinConvergenceHPETSc(MPI)?StokesStability_'
          --output-on-failure -j 1
      - name: Build PETSc pressure-spectrum suite
        if: startsWith(matrix.suite, 'pressure_')
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
        run: cmake --build build -j 2 --target RodinConvergenceHPETScStokesStability
      - name: Run PETSc pressure-spectrum suite
        if: startsWith(matrix.suite, 'pressure_')
        run: |
          case "${{ matrix.suite }}" in
            pressure_light) geometry_pattern='(Triangle|Quadrilateral|Hexahedron|Wedge)' ;;
            pressure_tetrahedron) geometry_pattern='Tetrahedron' ;;
            pressure_pyramid) geometry_pattern='Pyramid' ;;
            *) exit 1 ;;
          esac
          utility_pattern=''
          if [ "${{ matrix.context }}" = local ]; then
            if [ "${{ matrix.suite }}" = pressure_light ]; then utility_pattern='|Utility'; fi
            pattern="^RodinConvergenceHPETScStokesStability_((P4P3_(Rates_(Affine|Curved)N[345]|Controls)_)?${geometry_pattern}${utility_pattern})$"
          else
            rank="${{ matrix.context }}"
            rank="${rank#np}"
            case "$rank" in 1|2|3|4) ;; *) exit 1 ;; esac
            if [ "${{ matrix.suite }}" = pressure_light ]; then utility_pattern="|Utility_np${rank}"; fi
            pattern="^RodinConvergenceHPETScMPIStokesStability_((P4P3_)?np${rank}_((Rates_(Affine|Curved)N[345]|Controls)_)?${geometry_pattern}${utility_pattern})$"
          fi
          # Record existing placement without changing binding or thread policy.
          lscpu
          grep '^Cpus_allowed_list:' /proc/self/status
          printf 'OMP_NUM_THREADS=%s OPENBLAS_NUM_THREADS=%s\n' \
            "${OMP_NUM_THREADS:-unset}" "${OPENBLAS_NUM_THREADS:-unset}"
          ctest --test-dir build/tests -R "$pattern" --show-only=json-v1 \
            | jq '[.tests[] | {name, command}]'
          mpi_executable=$(sed -n 's/^MPIEXEC_EXECUTABLE:FILEPATH=//p' build/CMakeCache.txt)
          if [ "${{ matrix.context }}" != local ] && [ -n "$mpi_executable" ] \
              && "$mpi_executable" --version | grep -Eq 'Open MPI|OpenRTE'; then
            if ! "$mpi_executable" -n "$rank" --oversubscribe --report-bindings \
                /bin/sh -c 'printf "MPI rank=%s " "$OMPI_COMM_WORLD_RANK"; grep "^Cpus_allowed_list:" /proc/self/status'; then
              printf '::warning::MPI placement probe failed; numerical tests still run.\n'
            fi
          fi
          # This is a process resource report, not summed MPI peak memory or a benchmark.
          /usr/bin/time --verbose ctest --test-dir build/tests -R "$pattern" \
            --output-on-failure --no-tests=error -j 1
      - name: Build PETSc Poisson boundary convergence suite
        if: matrix.suite == 'poisson_boundary'
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
        run: cmake --build build -j 2 --target RodinConvergenceHPETScPoissonBoundary
      - name: Run PETSc Poisson boundary convergence suite
        if: matrix.suite == 'poisson_boundary'
        run: ctest --test-dir build/tests -R '^RodinConvergenceHPETScPoissonBoundary_' --output-on-failure -j 1
      - name: Build PETSc linear elasticity boundary convergence suite
        if: matrix.suite == 'elasticity_boundary'
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
        run: cmake --build build -j 2 --target RodinConvergenceHPETScLinearElasticityBoundary
      - name: Run PETSc linear elasticity boundary convergence suite
        if: matrix.suite == 'elasticity_boundary'
        run: ctest --test-dir build/tests -R '^RodinConvergenceHPETScLinearElasticityBoundary_' --output-on-failure -j 1
      - name: Build PETSc conductivity boundary convergence suite
        if: matrix.suite == 'conductivity_boundary'
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
        run: cmake --build build -j 2 --target RodinConvergenceHPETScConductivityBoundary
      - name: Run PETSc conductivity boundary convergence suite
        if: matrix.suite == 'conductivity_boundary'
        run: ctest --test-dir build/tests -R '^RodinConvergenceHPETScConductivityBoundary_' --output-on-failure -j 1
      - name: Build PETSc Stokes traction convergence suite
        if: matrix.suite == 'stokes_boundary'
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
        run: cmake --build build -j 2 --target RodinConvergenceHPETScStokesBoundary
      - name: Run PETSc Stokes traction convergence suite
        if: matrix.suite == 'stokes_boundary'
        run: ctest --test-dir build/tests -R '^RodinConvergenceHPETScStokesBoundary_' --output-on-failure -j 1
      - name: Build PETSc reaction-diffusion boundary convergence suite
        if: matrix.suite == 'reaction_boundary'
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
        run: cmake --build build -j 2 --target RodinConvergenceHPETScReactionDiffusionBoundary
      - name: Run PETSc reaction-diffusion boundary convergence suite
        if: matrix.suite == 'reaction_boundary'
        run: ctest --test-dir build/tests -R '^RodinConvergenceHPETScReactionDiffusionBoundary_' --output-on-failure -j 1
      - name: Build PETSc nonlinear Poisson boundary convergence suite
        if: startsWith(matrix.suite, 'nonlinear_boundary')
        env:
          GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
        run: cmake --build build -j 2 --target RodinConvergenceHPETScNonlinearPoissonBoundary
      - name: Run PETSc nonlinear Poisson boundary convergence suite
        if: startsWith(matrix.suite, 'nonlinear_boundary')
        run: |
          if [ "${{ matrix.suite }}" = "nonlinear_boundary_tetrahedron" ]; then
            ctest --test-dir build/tests -R '^RodinConvergenceHPETScNonlinearPoissonBoundary_.*Tetrahedron$' --output-on-failure -j 1
          elif [ "${{ matrix.suite }}" = "nonlinear_boundary_pyramid" ]; then
            ctest --test-dir build/tests -R '^RodinConvergenceHPETScNonlinearPoissonBoundary_.*Pyramid$' --output-on-failure -j 1
          else
            ctest --test-dir build/tests -R '^RodinConvergenceHPETScNonlinearPoissonBoundary_' -E '(Tetrahedron|Pyramid)$' --output-on-failure -j 1
          fi
      - name: Publish independent production coverage
        id: coverage_record
        uses: ./.github/actions/coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          definition: '{"job":"${{ github.job }}","matrix":${{ toJSON(matrix) }}}'
          artifact_name: ci-target-${{ github.job }}-${{ strategy.job-index }}

    name: ${{ matrix.path }} (multithreaded=${{ matrix.multithreaded }}, suite=${{ matrix.suite }}, context=${{ matrix.context }})
  PETScDegreeConvergence:
    needs:
      - Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - multithreaded: 'ON'
