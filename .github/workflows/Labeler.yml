# Label only from trusted base-branch rules; never check out pull-request code here.
name: Labeler
'on':
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [master, develop]

permissions:
  contents: read

jobs:
  label:
    name: Apply Labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: false
          dot: true
