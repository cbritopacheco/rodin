# Generated by dev/ci_schedule.py --write; edit registration or .github/ci/targeted-lanes.yml.
name: Tests / Dedicated Selection
'on':
  workflow_call:
    inputs:
      matrix:
        type: string
        required: true
    secrets:
      CODECOV_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
jobs:
  PETScCurvedConvergence:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.physics == 'NonlinearPoisson' && 360 || 240 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    env:
      OMP_NUM_THREADS: 2
      OMP_WAIT_POLICY: PASSIVE
      OPENBLAS_NUM_THREADS: 1
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: false
    - uses: ./.github/actions/prepare-apt
    - name: Setup Cpp
      uses: aminya/setup-cpp@v1
      with:
        compiler: gcc-14
        cmake: true
    - name: Install dependencies
      uses: ./.github/actions/apt-dependencies
      with:
        packages: lcov libboost1.74-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev libmetis-dev libhdf5-dev petsc-dev
          mpich
    - name: Restore shared test build
      uses: ./.github/actions/test-build
      with:
        job: PETScCurvedConvergence
        matrix: ${{ toJSON(matrix) }}
    - name: Run curved PETSc convergence suites
      run: "physics_pattern='${{ matrix.physics }}'\nif [ \"${{ matrix.physics }}\" = Diffusion ]; then\n  physics_pattern='(Approximated|Lifted|SmoothLifted)?Diffusion'\n\
        fi\ncase \"${{ matrix.geometry }}\" in\n  tetrahedron) geometry_pattern='Tetrahedron' ;;\n  pyramid) geometry_pattern='Pyramid'\
        \ ;;\n  light) geometry_pattern='(Segment|Triangle|Quadrilateral|Hexahedron|Wedge)' ;;\n  *) exit 1 ;;\nesac\ncase\
        \ \"${{ matrix.selection }}\" in\n  all) context_pattern='(MPI)?'; rank_pattern='.*' ;;\n  local) context_pattern='';\
        \ rank_pattern='.*' ;;\n  np1|np2|np3|np4) context_pattern='MPI'; rank_pattern=\".*${{ matrix.selection }}_\" ;;\n\
        \  *) exit 1 ;;\nesac\npartition_pattern='.*'\nexclude_pattern='a^'\ncase \"${{ matrix.partition }}\" in\n  all) ;;\n\
        \  Lifted) partition_pattern='Q[13]Test_LiftedAffineRates_' ;;\n  Controls) exclude_pattern='Rates_' ;;\n  *) partition_pattern='Test_${{\
        \ matrix.partition }}Rates_' ;;\nesac\nctest --test-dir build/tests \\\n  -R \"^RodinConvergenceIsoparametricPETSc${context_pattern}${physics_pattern}_${rank_pattern}${partition_pattern}${geometry_pattern}$\"\
        \ \\\n  -E \"$exclude_pattern\" --output-on-failure --no-tests=error -j 1\n"
    - name: Publish independent production coverage
      id: coverage_record
      uses: ./.github/actions/coverage
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        definition: '{"job":"${{ github.job }}","matrix":${{ toJSON(matrix) }}}'
    name: ${{ matrix.path }} (MT=${{ matrix.multithreaded }}, Suite=${{ matrix.suite }}, Geometry=${{ matrix.geometry }},
      Selection=${{ matrix.selection }}, Physics=${{ matrix.physics }}, Partition=${{ matrix.partition }})
