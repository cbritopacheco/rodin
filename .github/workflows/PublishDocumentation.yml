name: Publish documentation manually
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  Documentation:
    uses: ./.github/workflows/Documentation.yml
  PublishDocumentation:
    name: Publish documentation
    needs: Documentation
    runs-on: ubuntu-24.04
    concurrency:
      group: rodin-gh-pages-publication
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r doc/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: documentation
          path: documentation-site
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .ci-pages
          lfs: false
      - name: Integrate documentation with the latest complete benchmark histories
        env:
          REF: ${{ github.ref }}
        run: python3 dev/benchmark_publish.py --documentation-only --site documentation-site --pages .ci-pages --ref "$REF"
      - name: Publish documentation Pages update
        working-directory: .ci-pages
        env:
          SHA: ${{ github.sha }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish documentation $SHA"
            git push origin HEAD:gh-pages
          fi
      - name: Deploy and verify the published Pages snapshot
        id: deployment
        uses: ./.github/actions/publish-pages
        with:
          checkout: .ci-pages
          artifact-name: documentation-pages
