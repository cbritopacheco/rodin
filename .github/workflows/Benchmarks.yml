name: Benchmarks
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
concurrency:
  group: Benchmarks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  Infrastructure:
    if: ${{ !github.event.pull_request.draft }}
    name: Infrastructure checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Initialize pinned search engine
        run: git submodule update --init third-party/m.css
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r doc/requirements.txt
      - run: python3 -m unittest discover -s dev -p 'test_benchmark_*.py' -v
      - run: node --check dev/benchmarks/charts.js
  Local:
    if: ${{ !github.event.pull_request.draft }}
    name: Local
    needs: Infrastructure
    uses: ./.github/workflows/BenchmarkConfiguration.yml
    with:
      configuration: local
  Distributed:
    if: ${{ !github.event.pull_request.draft }}
    name: MPI and PETSc
    needs: Infrastructure
    uses: ./.github/workflows/BenchmarkConfiguration.yml
    with:
      configuration: distributed
  Pool:
    name: Validate complete campaign
    needs: [Local, Distributed]
    if: ${{ (always()) && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r doc/requirements.txt
      - name: Require successful execution configurations
        env:
          LOCAL: ${{ needs.Local.result }}
          DISTRIBUTED: ${{ needs.Distributed.result }}
        run: test "$LOCAL" = success && test "$DISTRIBUTED" = success
      - uses: ./.github/actions/download-artifacts
        with:
          names: '["benchmark-plan-common-local", "benchmark-plan-common-distributed"]'
          path: benchmark-inputs
      - run: python3 dev/benchmark_ci.py artifact-groups --artifacts benchmark-inputs --output benchmark-group-names.json
      - uses: ./.github/actions/download-artifacts
        with:
          names-file: benchmark-group-names.json
          path: benchmark-inputs
      - run: python3 dev/benchmark_ci.py artifact-results --artifacts benchmark-inputs --output benchmark-result-names.json
      - uses: ./.github/actions/download-artifacts
        with:
          names-file: benchmark-result-names.json
          path: benchmark-inputs
      - run: python3 dev/benchmark_ci.py pool --artifacts benchmark-inputs --output benchmark-complete
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: benchmark-complete
          path: benchmark-complete
          if-no-files-found: error
  Publish:
    name: Publish documentation and benchmarks
    needs: Pool
    if: ${{ (always()) && !github.event.pull_request.draft && github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') }}
    runs-on: ubuntu-24.04
    concurrency:
      group: rodin-gh-pages-publication
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: Documentation and benchmarks
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require complete benchmark results
        env:
          POOL: ${{ needs.Pool.result }}
        run: test "$POOL" = success
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r doc/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-complete
          path: benchmark-complete
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .ci-pages
          lfs: false
      - name: Update complete benchmark histories
        env:
          REF: ${{ github.ref }}
          RUN: ${{ github.run_id }}.${{ github.run_attempt }}
        run: python3 dev/benchmark_publish.py --results benchmark-complete --site ".ci-pages/docs/$REF" --pages .ci-pages --ref "$REF" --run "$RUN"
      - name: Publish one atomic Pages update
        working-directory: .ci-pages
        env:
          SHA: ${{ github.sha }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish complete benchmark campaign $SHA"
            git push origin HEAD:gh-pages
          fi
      - name: Publish documentation and benchmarks
        id: deployment
        uses: ./.github/actions/publish-pages
        with:
          checkout: .ci-pages
          artifact-name: benchmark-pages
