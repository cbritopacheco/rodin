# Generated by dev/ci_schedule.py --write; edit registration or .github/ci/targeted-lanes.yml.
name: Tests / Dedicated Selection
'on':
  workflow_call:
    inputs:
      matrix:
        type: string
        required: true
    secrets:
      CODECOV_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
jobs:
  PETScDegreeConvergence:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    env:
      OMP_NUM_THREADS: 2
      OMP_WAIT_POLICY: PASSIVE
      OPENBLAS_NUM_THREADS: 1
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: false
    - name: Setup Cpp
      uses: aminya/setup-cpp@v1
      with:
        compiler: gcc-14
        cmake: true
    - name: Install dependencies
      uses: ./.github/actions/apt-dependencies
      with:
        packages: lcov libboost1.74-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev libmetis-dev libhdf5-dev petsc-dev
          mpich
    - name: Restore shared test build
      uses: ./.github/actions/test-build
      with:
        job: PETScDegreeConvergence
        matrix: ${{ toJSON(matrix) }}
    - name: Run PETSc degree-refinement suites
      run: "prefix='^RodinConvergence(P|HP)PETSc${{ matrix.physics }}_'\nif [ \"${{ matrix.context }}\" != local ]; then\n\
        \  if [ \"${{ matrix.physics }}\" = Stokes ]; then\n    prefix='^RodinConvergence(P|HP)PETScMPIStokes_${{ matrix.context\
        \ }}_'\n  else\n    prefix=\"${prefix}MPI_${{ matrix.context }}_\"\n  fi\nfi\nctest --test-dir build/tests \\\n  -R\
        \ \"${prefix}[A-Za-z]+$\" \\\n  --output-on-failure --no-tests=error -j 1\n"
    - name: Publish independent production coverage
      id: coverage_record
      uses: ./.github/actions/coverage
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        definition: '{"job":"${{ github.job }}","matrix":${{ toJSON(matrix) }}}'
    name: ${{ matrix.path }} (MT=${{ matrix.multithreaded }}, Suite=${{ matrix.suite }}, Physics=${{ matrix.physics }}, Context=${{
      matrix.context }})
