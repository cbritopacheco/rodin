# Generated by dev/ci_schedule.py --write; edit registration or .github/ci/targeted-lanes.yml.
name: Tests / Dedicated Selection
'on':
  workflow_call:
    inputs:
      matrix:
        type: string
        required: true
    secrets:
      CODECOV_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
jobs:
  ConvergenceBaseline:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (matrix.suite == 'curved_nonlinear_pyramid' || matrix.suite == 'pressure_pyramid' || endsWith(matrix.group,
      '/NonlinearPoisson')) && 360 || matrix.suite == 'baseline' && 90 || 180 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    env:
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
      RODIN_PROFILE_STABILITY: ${{ startsWith(matrix.suite, 'pressure_') && '1' || '0' }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: false
    - uses: ./.github/actions/prepare-apt
    - name: Setup Cpp
      uses: aminya/setup-cpp@v1
      with:
        compiler: gcc-14
        cmake: true
    - name: Install dependencies
      uses: ./.github/actions/apt-dependencies
      with:
        packages: lcov libboost1.74-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev libmetis-dev libhdf5-dev libomp-dev
    - uses: ./.github/actions/test-build
      with:
        job: ConvergenceBaseline
        matrix: ${{ toJSON(matrix) }}
    - name: Run convergence suites
      run: "curved_pattern='^RodinConvergenceIsoparametric(P0Projection|GeometryApproximation|.*Diffusion|NonlinearPoisson|LinearElasticity|Stokes|Helmholtz)_'\n\
        case \"${{ matrix.suite }}\" in\n  baseline)\n    python3 dev/ci_tests.py run --group \"$CONVERGENCE_GROUP\" --profile\
        \ convergence-baseline ;;\n  pressure_light) pressure_exclude='_(Tetrahedron|Pyramid)$' ;;\n  pressure_tetrahedron)\
        \ pressure_exclude='_(Triangle|Quadrilateral|Pyramid|Hexahedron|Wedge|Utility|Workspace)$' ;;\n  pressure_pyramid)\
        \ pressure_exclude='_(Triangle|Quadrilateral|Tetrahedron|Hexahedron|Wedge|Utility|Workspace)$' ;;\n  curved_projection)\
        \ suite_pattern='(P0Projection|GeometryApproximation)' ;;\n  curved_diffusion_*) suite_pattern='(Approximated|Lifted|SmoothLifted)?Diffusion'\
        \ ;;\n  curved_reaction_*) suite_pattern='ReactionDiffusion' ;;\n  curved_nonlinear_*) suite_pattern='NonlinearPoisson'\
        \ ;;\n  curved_elasticity) suite_pattern='LinearElasticity' ;;\n  curved_stokes) suite_pattern='Stokes' ;;\n  curved_helmholtz)\
        \ suite_pattern='Helmholtz' ;;\n  *) exit 1 ;;\nesac\nif [[ \"${{ matrix.suite }}\" == pressure_* ]]; then\n  ctest\
        \ --test-dir build/tests -L convergence \\\n    -R '^RodinConvergenceHStokesStability_' -E \"$pressure_exclude\" \\\
        \n    --output-on-failure --no-tests=error -j 1\nelif [[ \"${{ matrix.suite }}\" == curved_diffusion_* || \\\n   \
        \     \"${{ matrix.suite }}\" == curved_reaction_* || \\\n        \"${{ matrix.suite }}\" == curved_nonlinear_* ]];\
        \ then\n  case \"${{ matrix.suite }}\" in\n    *_light) geometry_exclude='_(Tetrahedron|Pyramid)$' ;;\n    *_tetrahedron)\
        \ geometry_exclude='_(Segment|Triangle|Quadrilateral|Pyramid|Hexahedron|Wedge)$' ;;\n    *_pyramid) geometry_exclude='_(Segment|Triangle|Quadrilateral|Tetrahedron|Hexahedron|Wedge)$'\
        \ ;;\n    *) exit 1 ;;\n  esac\n  ctest --test-dir build/tests -L convergence \\\n    -R \"^RodinConvergenceIsoparametric${suite_pattern}_\"\
        \ -E \"$geometry_exclude\" \\\n    --output-on-failure --no-tests=error -j 1\nelif [ \"${{ matrix.suite }}\" != baseline\
        \ ]; then\n  ctest --test-dir build/tests -L convergence \\\n    -R \"^RodinConvergenceIsoparametric${suite_pattern}_\"\
        \ \\\n    --output-on-failure --no-tests=error -j 1\nfi\n"
      env:
        CONVERGENCE_GROUP: ${{ matrix.group }}
    - name: Publish independent production coverage
      id: coverage_record
      uses: ./.github/actions/coverage
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        definition: '{"job":"${{ github.job }}","matrix":${{ toJSON(matrix) }}}'
    name: ${{ matrix.path }} (MT=${{ matrix.multithreaded }}, Suite=${{ matrix.suite }})
