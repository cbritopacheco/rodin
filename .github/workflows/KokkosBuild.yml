name: Compile / Kokkos
# Compiles the Kokkos unit tests and examples for CUDA, HIP and SYCL in the images of
# dev/docker/kokkos, without running them: hosted runners have no GPU.
# The images come from the registry named by the repository variable
# RODIN_KOKKOS_CI_IMAGES, by default the public ghcr.io/keckj/rodin-kokkos-ci images.
permissions:
  contents: read
  packages: read
on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches: [master, develop]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: KokkosBuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Kokkos:
    name: Ubuntu 24.04 / Kokkos / ${{ matrix.backend }} / ${{ matrix.target }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      matrix:
        include:
          - image: cuda-sm52
            backend: CUDA
            target: Maxwell sm_52
          - image: hip-gfx1201
            backend: HIP
            target: RDNA 4 gfx1201
          - image: sycl-bmg
            backend: SYCL
            target: Battlemage
      fail-fast: false
    env:
      IMAGE: ${{ vars.RODIN_KOKKOS_CI_IMAGES || 'ghcr.io/keckj/rodin-kokkos-ci' }}:${{ matrix.image }}
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          lfs: false
      # The CUDA image takes 19 GB once unpacked.
      - name: Check image disk headroom
        run: python3 dev/ci_environment.py disk --minimum-gib 32
      - name: Pull image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE"
      - name: Build Kokkos tests
        run: >
          docker run --rm -e JOBS=4 -v "$GITHUB_WORKSPACE:/rodin" -w /rodin "$IMAGE"
          dev/docker/kokkos/ci-test.sh --build-only /rodin /rodin/build-kokkos-ci
