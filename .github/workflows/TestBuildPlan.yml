name: Tests / Build / Plan
'on':
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
    outputs:
      directory_1:
        value: ${{ jobs.Plan.outputs.directory_1 }}
      directory_2:
        value: ${{ jobs.Plan.outputs.directory_2 }}
      directory_3:
        value: ${{ jobs.Plan.outputs.directory_3 }}
      directory_4:
        value: ${{ jobs.Plan.outputs.directory_4 }}
permissions:
  contents: read
  actions: read
jobs:
  Plan:
    name: Configure directory ownership
    runs-on: ubuntu-latest
    outputs:
      directory_1: ${{ steps.plan.outputs.directory_1 }}
      directory_2: ${{ steps.plan.outputs.directory_2 }}
      directory_3: ${{ steps.plan.outputs.directory_3 }}
      directory_4: ${{ steps.plan.outputs.directory_4 }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/download-artifact@v4
        with:
          name: ci-test-plan
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-common-manifest-${{ inputs.mode }}-*
          path: ci-common-records
      - name: Plan unique directory ownership from configured CMake manifests
        id: plan
        env:
          MODE: ${{ inputs.mode }}
        run: python3 dev/ci_build_graph.py index --mode "$MODE"
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ci-build-index-${{ inputs.mode }}
          path: |
            ci-build-index.json
            ci-directory-plan.json
          if-no-files-found: error
