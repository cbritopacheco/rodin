name: Tests / Configuration
'on':
  workflow_call:
    inputs:
      definition:
        type: string
        required: true
      id:
        type: string
        required: true
    secrets:
      CODECOV_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
jobs:
  Common:
    name: Build / Common Libraries
    runs-on: ${{ fromJSON(inputs.definition).runner }}
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
      OMP_WAIT_POLICY: PASSIVE
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: false
    - uses: ./.github/actions/test-environment
      with:
        definition: ${{ inputs.definition }}
    - name: Install pinned lane planning dependency
      run: python3 -m pip install PyYAML==6.0.2
    - uses: actions/download-artifact@v4
      with:
        name: ci-test-plan
        path: .
    - name: Compile common libraries once
      env:
        DEFINITION: ${{ inputs.definition }}
      run: python3 dev/ci_build_graph.py common --definition "$DEFINITION"
    - uses: actions/upload-artifact@v4
      with:
        overwrite: true
        name: ci-common-${{ inputs.id }}
        path: ci-common-artifact/
        compression-level: 0
        retention-days: 7
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      with:
        overwrite: true
        name: ci-common-manifest-${{ fromJSON(inputs.definition).mode }}-${{ inputs.id }}
        path: ci-common-record/
        if-no-files-found: error
    - name: Bind configured targets to independent hierarchy edges
      id: schedule
      env:
        COMMON_ID: ${{ inputs.id }}
      run: python3 dev/ci_schedule.py --prepare "$COMMON_ID"
    - uses: actions/upload-artifact@v4
      with:
        overwrite: true
        name: ci-build-index-${{ inputs.id }}
        path: ci-build-index.json
        if-no-files-found: error
