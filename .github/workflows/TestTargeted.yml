    - name: Restore shared test build
      uses: ./.github/actions/test-build
      with:
        job: PETScCurvedNonlinearTetrahedronConvergence
        matrix: ${{ toJSON(matrix) }}
    - name: Run curved nonlinear tetrahedral convergence partition
      run: "case \"${{ matrix.selection }}\" in\n  local) context_pattern='' ;;\n  np1|np2|np3|np4) context_pattern='MPI_${{\
        \ matrix.selection }}_' ;;\n  *) exit 1 ;;\nesac\nprefix=\"^RodinConvergenceIsoparametricPETScNonlinearPoissonBoundary_${context_pattern}\"\
        \ncase \"${{ matrix.partition }}\" in\n  MixedNeumannP1Rates|RobinP1Rates|PureNeumannP1Rates)\n    ctest --test-dir\
        \ build/tests \\\n      -R \"${prefix}${{ matrix.partition }}_Tetrahedron$\" \\\n      --output-on-failure --no-tests=error\
        \ -j 1 ;;\n  remaining)\n    ctest --test-dir build/tests \\\n      -R \"${prefix}[A-Za-z0-9]+_Tetrahedron$\" \\\n\
        \      -E '_(MixedNeumann|Robin|PureNeumann)P1Rates_Tetrahedron$' \\\n      --output-on-failure --no-tests=error -j\
        \ 1 ;;\n  *) exit 1 ;;\nesac\n"
    - name: Publish independent production coverage
      id: coverage_record
      uses: ./.github/actions/coverage
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        definition: '{"job":"${{ github.job }}","matrix":${{ toJSON(matrix) }}}'
    name: ${{ matrix.path }} (MT=${{ matrix.multithreaded }}, Selection=${{ matrix.selection }}, Partition=${{ matrix.partition
      }})
    if: ${{ inputs.family == 'PETScCurvedNonlinearTetrahedronConvergence' }}
  PETScComplexConvergence:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.suite == 'curved_boundary' && 240 || startsWith(matrix.suite, 'curved_helmholtz') && 180 ||
      120 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    env:
      GCOV: gcov-14
      RODIN_COVERAGE: ${{ matrix.suite == 'submesh' && 'ON' || 'OFF' }}
      OMP_NUM_THREADS: 2
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: false
    - name: Setup Cpp
      uses: aminya/setup-cpp@v1
      with:
        compiler: gcc-14
        cmake: true
    - name: Install complex PETSc dependencies
      run: sudo apt-get update && sudo apt-get install -y lcov libboost1.74-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev
        libmetis-dev libhdf5-dev libomp-dev libpetsc-complex3.19-dev openmpi-bin libopenmpi-dev pkg-config lcov
    - name: Restore shared test build
      uses: ./.github/actions/test-build
      with:
        job: PETScComplexConvergence
        matrix: ${{ toJSON(matrix) }}
    - name: Run complex PETSc convergence suite
      if: matrix.suite == 'bulk'
      run: ctest --test-dir build/tests -R 'RodinConvergence(H|P|HP)PETSc(MPI)?Helmholtz|RodinPETScSNESStateTest|RodinPETSc(MPI)?ScalarIntegralTest|Rodin_Variational_Integral'
        -E '^RodinConvergenceHPETScHelmholtzBoundary_' --output-on-failure --no-tests=error -j 1
    - name: Run curved complex PETSc Helmholtz suite
      if: startsWith(matrix.suite, 'curved_helmholtz')
      run: "case \"${{ matrix.suite }}\" in\n  curved_helmholtz_light) geometry_pattern='(Segment|Triangle|Quadrilateral|Hexahedron|Wedge)'\
        \ ;;\n  curved_helmholtz_tetrahedron) geometry_pattern='Tetrahedron' ;;\n  curved_helmholtz_pyramid) geometry_pattern='Pyramid'\
        \ ;;\n  *) exit 1 ;;\nesac\nctest --test-dir build/tests \\\n  -R \"^RodinConvergenceIsoparametricPETSc(MPI)?Helmholtz_.*${geometry_pattern}$\"\
        \ \\\n  --output-on-failure --no-tests=error -j 1\n"
    - name: Run curved complex PETSc projection suite
      if: matrix.suite == 'curved_projection'
      run: ctest --test-dir build/tests -R '^RodinConvergenceIsoparametricPETSc(MPI)?P0Projection_' --output-on-failure --no-tests=error
        -j 1
    - name: Run complex PETSc Helmholtz boundary suite
      if: matrix.suite == 'boundary'
      run: "context_pattern=''\nif [ \"${{ matrix.context }}\" != local ]; then context_pattern='MPI_${{ matrix.context }}_';\
        \ fi\nctest --test-dir build/tests -R \"^RodinConvergenceHPETScHelmholtzBoundary_${context_pattern}[A-Za-z]+$\" \\\
        \n  --output-on-failure --no-tests=error -j 1\n"
    - name: Discover coverage tests without runtime profiles
      if: matrix.suite == 'submesh'
      env:
        GCOV_PREFIX: ${{ github.workspace }}/coverage-discovery-excluded
      run: 'mkdir -p coverage-discovery-excluded

        ctest --test-dir build/tests --show-only=json-v1 > coverage-discovery-excluded/tests.json

        '
    - name: Run complex PETSc SubMesh restriction matrix
      if: matrix.suite == 'submesh'
      env:
        OMP_WAIT_POLICY: PASSIVE
        OPENBLAS_NUM_THREADS: 1
        OMPI_MCA_hwloc_base_binding_policy: none
      run: ctest --test-dir build/tests -R '^RodinPETScMPIH1SubMeshRestrictionTest_np(1|2|3|4|8)_(Segment|Triangle|Quadrilateral|Tetrahedron|Pyramid|Hexahedron|Wedge)_(Affine|Curved)_K[1-6]$'
        --output-on-failure --no-tests=error -j 1
    - name: Retain complex H1 restriction diagnostics
      if: always() && matrix.suite == 'submesh'
      uses: actions/upload-artifact@v4
      with:
        overwrite: true
        name: petsc-complex-h1-restriction-diagnostics-mt${{ matrix.multithreaded }}
        path: 'build/tests/Testing/Temporary/LastTest.log

          build/tests/Testing/Temporary/LastTestsFailed.log

          '
        if-no-files-found: ignore
    - name: Run curved complex PETSc Helmholtz boundary suite
      if: matrix.suite == 'curved_boundary'
      run: ctest --test-dir build/tests -R '^RodinConvergenceIsoparametricPETScHelmholtzBoundary_' --output-on-failure --no-tests=error
        -j 1
    - name: Publish independent production coverage
      id: coverage_record
      uses: ./.github/actions/coverage
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        definition: '{"job":"${{ github.job }}","matrix":${{ toJSON(matrix) }}}'
    name: ${{ matrix.path }} (MT=${{ matrix.multithreaded }}, Suite=${{ matrix.suite }}, Context=${{ matrix.context }})
    if: ${{ inputs.family == 'PETScComplexConvergence' }}
