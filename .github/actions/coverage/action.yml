name: Independent production coverage
description: Capture, audit, upload and record one successful execution partition.
inputs:
  token:
    description: Codecov upload token.
    required: false
  definition:
    description: JSON execution job and matrix coordinates.
    required: true
  artifact_name:
    description: Unique artifact name for this execution partition.
    required: true
runs:
  using: composite
  steps:
    - name: Capture production coverage
      id: coverage_capture
      shell: bash
      env:
        GCOV: gcov-14
      run: |
        cmake --build build --target RodinCoverage
        python3 dev/audit_coverage.py build/RodinCoverage.info --functions --output build/coverage-audit.json
    - name: Upload independent production coverage
      id: coverage_upload
      uses: codecov/codecov-action@v5
      with:
        files: ${{ github.workspace }}/build/RodinCoverage.info
        disable_search: true
        plugins: noop
        token: ${{ inputs.token }}
        name: ${{ inputs.artifact_name }}
        flags: tests
        root_dir: ${{ github.workspace }}
        use_pypi: true
        fail_ci_if_error: true
    - name: Record independent coverage contribution
      id: coverage_receipt
      shell: bash
      env:
        CI_TARGET_DEFINITION: ${{ inputs.definition }}
      run: python3 dev/ci_coverage.py record-target --output ci-target-result
    - name: Save independent coverage contribution
      uses: actions/upload-artifact@v4
      with:
        overwrite: true
        name: ${{ inputs.artifact_name }}
        path: ci-target-result
        if-no-files-found: error
