name: Publish documentation and benchmarks
description: Deploy the locked gh-pages checkout without queuing a second runner.
inputs:
  checkout:
    description: Checkout of the exact published gh-pages commit.
    required: true
  artifact-name:
    description: Unique Pages artifact name within this workflow run.
    required: true
outputs:
  page_url:
    description: Verified deployed site URL.
    value: ${{ steps.deployment.outputs.page_url }}
runs:
  using: composite
  steps:
    - name: Validate and identify the Pages snapshot
      id: snapshot
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CHECKOUT: ${{ inputs.checkout }}
      run: python3 dev/deploy_pages.py prepare --checkout "$CHECKOUT"
    - uses: actions/upload-pages-artifact@v4
      id: artifact
      with:
        name: ${{ inputs.artifact-name }}-${{ github.run_attempt }}
        path: ${{ inputs.checkout }}
    - name: Deploy the exact uploaded artifact
      id: deployment
      uses: actions/github-script@v8
      env:
        ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        SNAPSHOT: ${{ steps.snapshot.outputs.commit }}
        ACTION_PATH: ${{ github.action_path }}
      with:
        script: |
          const path = require('node:path');
          const {deployPages} = require(path.join(process.env.ACTION_PATH, 'deploy.js'));
          await deployPages(github, core, process.env.GITHUB_REPOSITORY,
            process.env.ARTIFACT_ID, process.env.SNAPSHOT);
    - name: Verify the served publication marker
      shell: bash
      env:
        CHECKOUT: ${{ inputs.checkout }}
        PAGE_URL: ${{ steps.deployment.outputs.page_url }}
      run: python3 dev/deploy_pages.py verify --checkout "$CHECKOUT" --url "$PAGE_URL"
