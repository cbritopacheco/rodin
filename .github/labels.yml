# Canonical GitHub label metadata; path matching lives in labeler.yml.
# Distinct shades within each family: blue core, green models, amber backends,
# light slate documentation/interfaces, teal validation, purple tooling,
# red defects and light grey dispositions. GitHub controls text colour.
core:
  color: '345679'
  description: Core library types, root headers and shared infrastructure.
