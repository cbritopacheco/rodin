          path: Convergence / Isoparametric / ReactionDiffusion
          group: ''
        - multithreaded: 'ON'
          suite: curved_nonlinear_light
          path: Convergence / Isoparametric / NonlinearPoisson
          group: ''
        - multithreaded: 'ON'
          suite: curved_nonlinear_tetrahedron
          path: Convergence / Isoparametric / NonlinearPoisson
          group: ''
        - multithreaded: 'ON'
          suite: curved_nonlinear_pyramid
          path: Convergence / Isoparametric / NonlinearPoisson
          group: ''
        - multithreaded: 'ON'
          suite: curved_elasticity_light
          path: Convergence / Isoparametric / LinearElasticity
          group: ''
        - multithreaded: 'ON'
          suite: curved_elasticity_tetrahedron
          path: Convergence / Isoparametric / LinearElasticity
          group: ''
        - multithreaded: 'ON'
          suite: curved_elasticity_pyramid
          path: Convergence / Isoparametric / LinearElasticity
          group: ''
