        - multithreaded: 'OFF'
          np: '2'
          partition: pyramid
          geometry: Pyramid
          path: Unit / Rodin / MPI / Variational / H1Restriction / Slow
        - multithreaded: 'OFF'
          np: '3'
          partition: standard
          geometry: (Segment|Triangle|Quadrilateral|Tetrahedron|Hexahedron|Wedge)
          path: Unit / Rodin / MPI / Variational / H1Restriction / Slow
        - multithreaded: 'OFF'
          np: '3'
          partition: pyramid
          geometry: Pyramid
          path: Unit / Rodin / MPI / Variational / H1Restriction / Slow
        - multithreaded: 'OFF'
          np: '4'
          partition: standard
          geometry: (Segment|Triangle|Quadrilateral|Tetrahedron|Hexahedron|Wedge)
          path: Unit / Rodin / MPI / Variational / H1Restriction / Slow
        - multithreaded: 'OFF'
          np: '4'
          partition: pyramid
          geometry: Pyramid
          path: Unit / Rodin / MPI / Variational / H1Restriction / Slow
        - multithreaded: 'OFF'
