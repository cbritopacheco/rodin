    env:
      OMP_NUM_THREADS: 2
      OMP_WAIT_POLICY: PASSIVE
      OPENBLAS_NUM_THREADS: 1
      RODIN_PROFILE_STABILITY: ${{ startsWith(matrix.suite, 'pressure_') && '1' || '0' }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: false
    - name: Setup Cpp
      uses: aminya/setup-cpp@v1
      with:
        compiler: gcc-14
        cmake: true
    - name: Install dependencies
      uses: ./.github/actions/apt-dependencies
      with:
        packages: lcov libboost1.74-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev libmetis-dev libhdf5-dev petsc-dev mpich
    - name: Restore shared test build
      uses: ./.github/actions/test-build
      with:
        job: PETScConvergence
        matrix: ${{ toJSON(matrix) }}
    - name: Run PETSc convergence suite
      if: matrix.suite == 'bulk'
      run: |
        case "${{ matrix.context }}" in
          local)
            pattern='^RodinConvergenceHPETSc'
            context_exclude='|^RodinConvergenceHPETScMPI' ;;
          np1|np2|np3|np4)
            pattern='^RodinConvergenceHPETScMPI.*_${{ matrix.context }}(_|$)'
            context_exclude='' ;;
          *) exit 1 ;;
        esac
        ctest --test-dir build/tests -R "$pattern" \
          -E "^RodinConvergenceHPETSc(Poisson|Conductivity|LinearElasticity|Stokes|ReactionDiffusion|NonlinearPoisson)Boundary_|^RodinConvergenceHPETSc(MPI)?StokesStability_${context_exclude}" \
          --output-on-failure --no-tests=error -j 1
    - name: Run PETSc pressure-spectrum suite
      if: startsWith(matrix.suite, 'pressure_')
      run: "case \"${{ matrix.suite }}\" in\n  pressure_light) geometry_pattern='(Triangle|Quadrilateral|Hexahedron|Wedge)'\
        \ ;;\n  pressure_tetrahedron) geometry_pattern='Tetrahedron' ;;\n  pressure_pyramid) geometry_pattern='Pyramid'\
        \ ;;\n  *) exit 1 ;;\nesac\nutility_pattern=''\nif [ \"${{ matrix.context }}\" = local ]; then\n  if [ \"\
        ${{ matrix.suite }}\" = pressure_light ]; then utility_pattern='|Utility'; fi\n  pattern=\"^RodinConvergenceHPETScStokesStability_((P4P3_(Rates_(Affine|Curved)N[345]|Controls)_)?${geometry_pattern}${utility_pattern})$\"\
        \nelse\n  rank=\"${{ matrix.context }}\"\n  rank=\"${rank#np}\"\n  case \"$rank\" in 1|2|3|4) ;; *) exit\
        \ 1 ;; esac\n  if [ \"${{ matrix.suite }}\" = pressure_light ]; then utility_pattern=\"|Utility_np${rank}\"\
        ; fi\n  pattern=\"^RodinConvergenceHPETScMPIStokesStability_((P4P3_)?np${rank}_((Rates_(Affine|Curved)N[345]|Controls)_)?${geometry_pattern}${utility_pattern})$\"\
        \nfi\n# Record existing placement without changing binding or thread policy.\nlscpu\ngrep '^Cpus_allowed_list:'\
        \ /proc/self/status\nprintf 'OMP_NUM_THREADS=%s OPENBLAS_NUM_THREADS=%s\\n' \\\n  \"${OMP_NUM_THREADS:-unset}\"\
        \ \"${OPENBLAS_NUM_THREADS:-unset}\"\nctest --test-dir build/tests -R \"$pattern\" --show-only=json-v1 \\\
        \n  | jq '[.tests[] | {name, command}]'\nmpi_executable=$(sed -n 's/^MPIEXEC_EXECUTABLE:FILEPATH=//p' build/CMakeCache.txt)\n\
        if [ \"${{ matrix.context }}\" != local ] && [ -n \"$mpi_executable\" ] \\\n    && \"$mpi_executable\" --version\
        \ | grep -Eq 'Open MPI|OpenRTE'; then\n  if ! \"$mpi_executable\" -n \"$rank\" --oversubscribe --report-bindings\
        \ \\\n      /bin/sh -c 'printf \"MPI rank=%s \" \"$OMPI_COMM_WORLD_RANK\"; grep \"^Cpus_allowed_list:\"\
        \ /proc/self/status'; then\n    printf '::warning::MPI placement probe failed; numerical tests still run.\\\
        n'\n  fi\nfi\n# This is a process resource report, not summed MPI peak memory or a benchmark.\n/usr/bin/time\
