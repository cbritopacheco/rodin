        job: PETScCurvedBoundaryConvergence
        matrix: ${{ toJSON(matrix) }}
    - name: Run curved boundary convergence partition
      run: |
        case "${{ matrix.geometry }}" in
          tetrahedron) geometry_pattern='Tetrahedron' ;;
          pyramid) geometry_pattern='Pyramid' ;;
          light) geometry_pattern='(Segment|Triangle|Quadrilateral|Hexahedron|Wedge)' ;;
          *) exit 1 ;;
        esac
        case "${{ matrix.selection }}" in
          all) context_pattern='(MPI_np[1-4]_)?' ;;
          local) context_pattern='' ;;
          np1|np2|np3|np4) context_pattern='MPI_${{ matrix.selection }}_' ;;
          *) exit 1 ;;
        esac
        case "${{ matrix.study }}" in
          all) study_pattern='([A-Za-z][A-Za-z0-9]*_)?' ;;
          MixedNeumannP[123]Rates|RobinP[123]Rates|PureNeumannP[123]Rates) study_pattern='${{ matrix.study }}_' ;;
          Controls) study_pattern='Controls_' ;;
          *) exit 1 ;;
        esac
        ctest --test-dir build/tests \
          -R "^RodinConvergenceIsoparametricPETSc${{ matrix.physics }}Boundary_${context_pattern}${study_pattern}${geometry_pattern}$" \
          --output-on-failure --no-tests=error -j 1
