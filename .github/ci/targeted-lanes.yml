        - multithreaded: 'OFF'
          np: '8'
          partition: pyramid
          geometry: Pyramid
          path: Unit / Rodin / MPI / Variational / H1Restriction / Slow
    env:
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
      OMP_WAIT_POLICY: PASSIVE
      OMPI_MCA_hwloc_base_binding_policy: none
      OMPI_MCA_mpi_yield_when_idle: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: false
    - name: Setup Cpp
      uses: aminya/setup-cpp@v1
      with:
        compiler: gcc-14
        cmake: true
    - name: Install dependencies
      uses: ./.github/actions/apt-dependencies
      with:
        packages: lcov libboost-all-dev libsuitesparse-dev libeigen3-dev libscotch-dev libmetis-dev libhdf5-dev lcov libomp-dev mpi-default-bin mpi-default-dev
    - name: Restore shared test build
      uses: ./.github/actions/test-build
      with:
        job: MPIH1Restriction
        matrix: ${{ toJSON(matrix) }}
    - name: Record native MPI CPU placement
      env:
        MPI_RANKS: ${{ matrix.np }}
      run: "lscpu\ngrep '^Cpus_allowed_list:' /proc/self/status\nmpi_executable=$(sed -n 's/^MPIEXEC_EXECUTABLE:FILEPATH=//p'\
        \ build/CMakeCache.txt)\nif [ -n \"$mpi_executable\" ] && \"$mpi_executable\" --version | grep -Eq 'Open\
        \ MPI|OpenRTE'; then\n  \"$mpi_executable\" -n \"$MPI_RANKS\" --oversubscribe --report-bindings \\\n   \
        \ /bin/sh -c 'printf \"MPI rank=%s \" \"$OMPI_COMM_WORLD_RANK\"; grep \"^Cpus_allowed_list:\" /proc/self/status'\n\
        fi\n"
    - name: Run native MPI restriction rank partition
      run: ctest --test-dir build/tests -R '^RodinMPIH1SubMeshRestrictionTest_${{ matrix.geometry }}_.*_np${{ matrix.np
        }}$' --no-tests=error --output-on-failure -j 1
    - name: Publish independent production coverage
      id: coverage_record
      uses: ./.github/actions/coverage
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        definition: '{"job":"${{ github.job }}","matrix":${{ toJSON(matrix) }}}'
    name: ${{ matrix.path }} (MT=${{ matrix.multithreaded }}, NP=${{ matrix.np }}, Partition=${{ matrix.partition
