# Source definitions for dedicated numerical lanes. Run dev/ci_schedule.py --write after editing.
jobs:
  Convergence:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (matrix.suite == 'curved_nonlinear_pyramid' || matrix.suite == 'pressure_pyramid' || endsWith(matrix.group,
      '/NonlinearPoisson')) && 360 || matrix.suite == 'baseline' && 90 || 180 }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - multithreaded: 'ON'
          suite: pressure_light
          path: Convergence / H / Stokes / Stability
          group: ''
        - multithreaded: 'ON'
          suite: pressure_tetrahedron
          path: Convergence / H / Stokes / Stability
          group: ''
        - multithreaded: 'ON'
          suite: pressure_pyramid
          path: Convergence / H / Stokes / Stability
          group: ''
        - multithreaded: 'ON'
          suite: curved_projection
          path: Convergence / Isoparametric / Projection
          group: ''
        - multithreaded: 'ON'
          suite: curved_diffusion_light
          path: Convergence / Isoparametric / Diffusion
          group: ''
        - multithreaded: 'ON'
          suite: curved_diffusion_tetrahedron
          path: Convergence / Isoparametric / Diffusion
          group: ''
        - multithreaded: 'ON'
          suite: curved_diffusion_pyramid
          path: Convergence / Isoparametric / Diffusion
          group: ''
        - multithreaded: 'ON'
