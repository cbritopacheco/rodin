coverage:
  status:
    project:
      default:
        # Compare library sources on both sides, matching RodinCoverage's
        # existing exclusion of test bodies and third-party dependencies.
        paths:
          - "src/"
        # Keep project coverage enforced, but allow tiny report jitter from
        # documentation/comment-heavy changes and coverage upload variance.
        threshold: 0.05%
    patch:
      default:
        # Documentation and formatting PRs can touch executable headers without
        # changing behavior. Keep patch coverage visible, but do not block on it.
        informational: true
